<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Capa</title>
<link rel="stylesheet" href="../marca/tokens.css">
<style>
  html, body { margin: 0; background: var(--fundo); }
  .capa { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--fundo); font-family: var(--fonte-mono); color: var(--texto-suave); }
  .luz { position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 70% 30% at 50% 70%, color-mix(in srgb, var(--luz-1) 40%, transparent) 0%, color-mix(in srgb, var(--luz-2) 45%, transparent) 45%, transparent 75%),
      radial-gradient(ellipse 70% 35% at 25% 22%, color-mix(in srgb, var(--luz-3) 55%, transparent), transparent 70%); }
  .poeira i { position: absolute; width: 6px; height: 6px; border-radius: 50%; transform: translate(-50%,-50%);
    background: radial-gradient(circle, var(--destaque-2), color-mix(in srgb, var(--destaque) 40%, transparent) 45%, transparent 72%); }
  .fantasma { position: absolute; right: -70px; top: 300px; font-family: var(--fonte-titulo); font-style: italic; font-size: 760px; line-height: .8; letter-spacing: -.04em;
    color: transparent; -webkit-text-stroke: 2.4px color-mix(in srgb, var(--destaque) 18%, transparent);
    background: linear-gradient(180deg, color-mix(in srgb, var(--destaque) 10%, transparent), transparent 85%); -webkit-background-clip: text; background-clip: text; }
  .topo { position: absolute; left: 65px; right: 65px; top: 330px; display: flex; align-items: center; gap: 24px; }
  .selo { width: 70px; height: 70px; border-radius: 50%; display: grid; place-items: center; border: 2.4px solid color-mix(in srgb, var(--destaque) 70%, transparent); color: var(--destaque); font-family: var(--fonte-titulo); font-size: 27px; }
  .handle { font-size: 33px; color: var(--texto); }
  .pilula { margin-left: auto; height: 66px; padding: 0 34px; border-radius: 99px; display: grid; place-items: center; border: 2.4px solid color-mix(in srgb, var(--destaque) 75%, transparent); color: var(--destaque); font-size: 24px; letter-spacing: .32em; text-transform: uppercase; }
  .regua { position: absolute; left: 65px; right: 65px; top: 430px; height: 2px; background: var(--linha); }
  .regua::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: linear-gradient(90deg, var(--destaque), color-mix(in srgb, var(--destaque) 25%, transparent)); }
  h1 { position: absolute; left: 65px; right: 50px; top: 470px; margin: 0; font-family: var(--fonte-titulo); font-weight: 400; font-size: 150px; line-height: .98; letter-spacing: -.025em; color: var(--texto); }
  h1 em { font-style: italic; color: var(--destaque); }
  h1 .num { font-style: italic; color: var(--destaque); }
  .leque { position: absolute; left: 0; right: 0; top: 1130px; height: 420px; }
  .card { position: absolute; top: 0; width: 262px; height: 300px; border-radius: 24px; overflow: hidden;
    box-shadow: inset 0 0 0 2px var(--vidro-borda), 0 30px 70px color-mix(in srgb, #000 70%, transparent); background: var(--vidro); }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card b { position: absolute; left: 18px; bottom: 16px; font-weight: 400; font-size: 19px; letter-spacing: .16em; text-transform: uppercase; color: var(--texto);
    padding: 8px 14px; border-radius: 99px; background: color-mix(in srgb, var(--fundo) 75%, transparent); }
  .trilha { position: absolute; left: 108px; right: 108px; top: 1600px; height: 3px; background: linear-gradient(90deg, color-mix(in srgb, var(--destaque) 55%, transparent), var(--destaque)); }
  .trilha i { position: absolute; top: 50%; width: 16px; height: 16px; border-radius: 50%; transform: translate(-50%,-50%); background: var(--destaque); }
  .trilha i.ult { width: 46px; height: 46px; background: radial-gradient(circle, var(--brilho) 0 34%, color-mix(in srgb, var(--destaque-2) 60%, transparent) 46%, transparent 72%); filter: drop-shadow(0 0 26px var(--destaque)); }
</style></head>
<body><div class="capa">
  <div class="luz"></div>
  <div class="poeira" id="poeira"></div>
  <div class="fantasma">05</div>
  <div class="topo"><span class="selo">RR</span><span class="handle">@ramosraul.ia</span><span class="pilula">Claude · 5 jeitos</span></div>
  <div class="regua"></div>
  <h1><span class="num">5</span> jeitos <em>inusitados</em> de usar o Claude</h1>
  <div class="leque" id="leque"></div>
  <div class="trilha"><i style="left:0"></i><i style="left:25%"></i><i style="left:50%"></i><i style="left:75%"></i><i class="ult" style="left:100%"></i></div>
</div>
<script>
  const r = (i, k) => { const x = Math.sin((i + 1) * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };
  document.getElementById('poeira').innerHTML = Array.from({ length: 40 }, (_, i) =>
    `<i style="left:${(r(i,3)*1080).toFixed(0)}px;top:${(r(i,2)*1920).toFixed(0)}px;opacity:${(0.15+0.6*r(i,5)).toFixed(2)};transform:translate(-50%,-50%) scale(${(0.6+1.4*r(i,6)).toFixed(2)})"></i>`).join('');
  const rot = ['01 wi‑fi', '02 exame', '03 tv', '04 rua', '05 diagrama'];
  const pos = [ [30, 26, -9, 1], [222, 0, -4.5, 2], [409, -12, 0, 5], [596, 0, 4.5, 2], [788, 26, 9, 1] ];
  const ordem = [0, 4, 1, 3, 2];
  document.getElementById('leque').innerHTML = ordem.map((i) => { const [x, y, a, z] = pos[i];
    const lado = i > 2 ? 'right:18px;left:auto' : '';
    return `<div class="card" style="left:${x}px;top:${y + 40}px;transform:rotate(${a}deg);z-index:${z}"><img src="t${i + 1}.png"><b style="${lado}">${rot[i]}</b></div>`; }).join('');
</script>
</body></html>
