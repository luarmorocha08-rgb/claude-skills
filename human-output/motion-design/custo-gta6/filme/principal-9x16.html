<script>/* transicoes.js — a biblioteca de transições entre cenas (o motor é dono delas).

   Cada transição escreve só nos invólucros: `.m-cena` (A.estilo: opacidade, desfoque, máscara)
   e `.m-camera` (A.posar: escala e posição da câmera do motor, origem no centro do quadro,
   p → s·p + (x, y) em cqw), mais as camadas do motor (Motion.camada('veu'), 'luz'), que ficam por
   cima de tudo e são zeradas a cada quadro. Assim a transição também é pura.

   modo 'sobreposta': as duas cenas tocam juntas; e.p vai de 0 a 1 na janela.
   modo 'encadeada': corte seco no meio; e.lado = 'A' com e.pA (0..1 até o corte) ou 'B' com e.pB.
   B pode ser null (saída final do filme). Uma transição própria do projeto vai em
   cenas/_transicoes.js com Motion.transicao('nome', { medir, preparar, aplicar }) e o modo/dur
   declarados no motion.json. */
(function () {
  'use strict';
  const TT = window.MotionTempo;
  const { clamp, lerp, prog, ease, suave, suave5, logLerp } = TT;
  const NS = 'http://www.w3.org/2000/svg';

  const selPonte = (nome) => `[data-ponte="${nome}"]`;
  const H = () => (Motion.ctx.formato.altura / Motion.ctx.formato.largura) * 100;
  const u = () => Motion.ctx.formato.largura / 100;

  /** Desfoque direcional na câmera do motor (obturador), σ em px. */
  function obturador(L, sx, sy) {
    const R = L.R;
    if (!R.__obt) {
      let svg = document.getElementById('m-fx-svg');
      if (!svg) {
        svg = document.createElementNS(NS, 'svg');
        svg.id = 'm-fx-svg';
        svg.setAttribute('width', '0');
        svg.setAttribute('height', '0');
        svg.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden';
        Motion.palco.appendChild(svg);
      }
      const f = document.createElementNS(NS, 'filter');
      f.id = `m-obt-cam-${R.id}`;
      f.setAttribute('x', '-20%');
      f.setAttribute('y', '-20%');
      f.setAttribute('width', '140%');
      f.setAttribute('height', '140%');
      f.setAttribute('color-interpolation-filters', 'sRGB');
      const g = document.createElementNS(NS, 'feGaussianBlur');
      f.appendChild(g);
      svg.appendChild(f);
      R.__obt = g;
    }
    const a = Math.round(Math.max(0, sx) * 4) / 4, b = Math.round(Math.max(0, sy) * 4) / 4;
    R.__obt.setAttribute('stdDeviation', `${a} ${b}`);
    if (a > 0 || b > 0) R.camera.style.filter = `url(#m-obt-cam-${R.id})`;
  }

  function veu(cor, o) {
    const v = Motion.camada('veu');
    v.style.cssText = `display:block;background:${cor};opacity:${clamp(o).toFixed(4)}`;
    return v;
  }

  const DIR = { esquerda: [-1, 0], direita: [1, 0], cima: [0, -1], baixo: [0, 1] };
  const DIR_TEXTO = { esquerda: 'a esquerda', direita: 'a direita', cima: 'cima', baixo: 'baixo' };

  /* ── corte ── */
  Motion.transicao('corte', { aplicar() {} });
  Motion.transicao('na-cena', { aplicar() {} });

  /* ── C1.1 + C1.2: corte seco no mesmo eixo, em movimento, com herança de velocidade ── */
  Motion.transicao('corte-no-eixo', {
    aplicar(e, A, B, op) {
      const forca = op.forca ?? 0.006, desf = op.desfoque ?? 0.42, K = op.K ?? 2.2, tau = op.tau ?? 0.17;
      const antes = op.__antes ?? 0.1, depois = op.__depois ?? 0.3;
      if (e.lado === 'A') {
        const g = (Math.pow(2, K * e.pA) - 1) / (Math.pow(2, K) - 1);
        A.posar({ s: 1 + forca * g });
        A.estilo({ blur: desf * g });
      } else if (B) {
        // velocidade de log-escala de A no último quadro, herdada por B e dissolvida devagar
        const vA = (forca * K * Math.LN2 * Math.pow(2, K)) / (Math.pow(2, K) - 1) / Math.max(0.01, antes) / (1 + forca);
        const D = Math.max(0.01, depois);
        const tB = e.pB * D;
        const ed = Math.exp(-D / tau);
        const a = vA * tau * (1 - ed);
        const f = (Math.exp(-tB / tau) - ed) / (1 - ed);
        B.posar({ s: Math.exp(-a * f) });
        B.estilo({ blur: desf * 0.6 * (1 - suave(tB / 0.09)) });
      }
    },
  });

  /* ── C1.4: avança, desfoca e apaga; a próxima nasce do desfoque no mesmo eixo ── */
  Motion.transicao('avancar-desfocar', {
    aplicar(e, A, B, op) {
      const av = op.avanco ?? 0.07, desf = op.desfoque ?? 0.8;
      if (e.lado === 'A') {
        const x = e.pA;
        A.posar({ s: 1 + av * ease.inCubic(x) });
        A.estilo({ blur: desf * x, o: 1 - x * x });
      } else if (B) {
        const x = ease.outCubic(e.pB);
        B.posar({ s: lerp(0.97, 1, x) });
        B.estilo({ blur: desf * (1 - x), o: suave(e.pB / 0.35) });
      }
    },
  });

  /* ── C1.8: véu uniforme, sem forma ── */
  Motion.transicao('esmaecer', {
    aplicar(e, A, B, op) {
      const cor = op.cor || 'var(--fundo)';
      if (!B) {
        veu(cor, ease.inOutSine(e.p));
        return;
      }
      if (e.p < 0.5) {
        B.estilo({ o: 0 });
        veu(cor, ease.inOutSine(e.p / 0.5));
      } else {
        A.estilo({ o: 0 });
        veu(cor, 1 - ease.inOutSine((e.p - 0.5) / 0.5));
      }
    },
  });

  /* ── crossfade ── */
  Motion.transicao('dissolver', {
    aplicar(e, A, B, op) {
      const x = ease.inOutSine(e.p);
      if (!B) {
        A.estilo({ o: 1 - x });
        return;
      }
      B.estilo({ o: x, blur: (op.desfoque || 0) * (1 - x) });
      if (op.escala) B.posar({ s: 1 + op.escala * (1 - x) });
    },
  });

  /* ── empurrar e chicote: B empurra A, com obturador direcional proporcional à velocidade ── */
  function empurrao(curva, fatorBlur, teto) {
    return {
      aplicar(e, A, B, op) {
        const d = DIR[op.direcao || 'esquerda'] || DIR.esquerda;
        const dist = d[0] ? 100 : H();
        const x = curva(e.p);
        const h = 0.004;
        const v = (Math.abs(curva(clamp(e.p + h)) - curva(clamp(e.p - h))) / (2 * h)) * dist / Math.max(0.05, op.__dur || 0.5);
        const sigma = Math.min(teto, v * fatorBlur * u());
        // a cena inteira anda (fundo junto): B entra colada em A, na mesma velocidade
        A.estilo({ x: d[0] * dist * x, y: d[1] * dist * x });
        obturador(A, d[0] ? sigma : 0, d[1] ? sigma : 0);
        if (B) {
          B.estilo({ x: -d[0] * dist * (1 - x), y: -d[1] * dist * (1 - x) });
          obturador(B, d[0] ? sigma : 0, d[1] ? sigma : 0);
        }
      },
    };
  }
  Motion.transicao('empurrar', empurrao(ease.inOutSine, 0.0028, 40));
  Motion.transicao('chicote', empurrao((p) => (p < 0.5 ? ease.inOutExpo(p) : 0.5 + 0.5 * ease.outExpo((p - 0.5) * 2)), 0.004, 90));

  /* ── C1.5: mergulho no elemento até ele virar o primeiro quadro da próxima ── */
  Motion.transicao('mergulho', {
    medir(op) {
      const m = [['A', op.alvo, 'fim']];
      if (op.ponte) m.push(['B', selPonte(op.ponte), 'inicio']);
      return m;
    },
    preparar(A, B, op, cache) {
      cache.a = op.alvo ? A.medida(op.alvo, 'fim') : null;
      cache.b = op.ponte && B ? B.medida(selPonte(op.ponte), 'inicio') : null;
      if (!cache.a) cache.a = { cx: 0, cy: 0, l: 40, a: 40 * 0.5625 };
    },
    aplicar(e, A, B, op, cache) {
      const a = cache.a, b = cache.b;
      const dur = op.__dur || 0.75;
      const fa = clamp((op.antecipacao ?? 0.2) / dur, 0, 0.6);
      const recuo = op.recuo ?? 0.025;
      const q = prog(e.p, 0, fa);
      const w = prog(e.p, fa * 0.55, 1);
      const ew = ease.mergulho(w);
      const sAnt = 1 - recuo * ease.inOutSine(q);
      const S1 = b ? b.l / a.l : (op.cobrir ?? 1.15) * Math.max(100 / a.l, H() / a.a);
      const S = sAnt * logLerp(1, S1 / (1 - recuo), ew);
      const dest = b ? [b.cx, b.cy] : [0, 0];
      const G = [lerp(a.cx, dest[0], ew), lerp(a.cy, dest[1], ew)];
      A.posar({ s: S, x: G[0] - S * a.cx, y: G[1] - S * a.cy });
      // no fim do mergulho A desfoca e apaga por baixo de B: o rastro rápido não vaza pela fusão
      A.estilo({ blur: 0.25 * ew * ew + 0.9 * suave(prog(e.p, 0.55, 1)), o: B ? 1 - suave(prog(e.p, 0.62, 0.96)) : 1 });
      // o resto escurece; o alvo fica aceso (véu com um buraco macio no alvo)
      const esc = (op.escurecer ?? 0.4) * suave(q) * (1 - suave(prog(w, 0.2, 0.7)));
      if (esc > 0.001) {
        const v = Motion.camada('veu');
        const px = u();
        const cx = (50 + G[0]) * px, cy = (H() / 2 + G[1]) * px;
        const rx = (S * a.l * 0.62 + 2) * px, ry = (S * a.a * 0.62 + 2) * px;
        const m = `radial-gradient(${rx.toFixed(1)}px ${ry.toFixed(1)}px at ${cx.toFixed(1)}px ${cy.toFixed(1)}px, transparent 55%, rgba(0,0,0,.6) 80%, #000 100%)`;
        v.style.cssText = `display:block;background:#000;opacity:${esc.toFixed(4)};-webkit-mask-image:${m};mask-image:${m}`;
      }
      if (!B) {
        veu('var(--fundo)', suave(prog(e.p, 0.7, 1)));
        return;
      }
      if (b) {
        // B preso ao alvo: a caixa-ponte de B coincide com o alvo na tela até assentar
        const sB = (S * a.l) / b.l;
        B.posar({ s: sB, x: G[0] - sB * b.cx, y: G[1] - sB * b.cy });
        B.estilo({ o: suave(prog(e.p, 0.55, 0.92)) });
      } else {
        const x = prog(e.p, 0.6, 1);
        B.posar({ s: lerp(1.06, 1, ease.outCubic(x)) });
        B.estilo({ o: suave(x / 0.8), blur: 0.5 * (1 - ease.outCubic(x)) });
      }
    },
  });

  /* ── C7: elemento compartilhado — a câmera leva o lugar dele numa cena até o lugar na outra ── */
  Motion.transicao('ponte', {
    medir(op) {
      return op.nome ? [['A', selPonte(op.nome), 'fim'], ['B', selPonte(op.nome), 'inicio']] : [];
    },
    preparar(A, B, op, cache) {
      cache.a = op.nome ? A.medida(selPonte(op.nome), 'fim') : null;
      cache.b = op.nome && B ? B.medida(selPonte(op.nome), 'inicio') : null;
      if (!cache.a || !cache.b) Motion.erro(A.id, 'transicao', null, `ponte: marque o mesmo data-ponte="${op.nome}" nas duas cenas`);
    },
    aplicar(e, A, B, op, cache) {
      const a = cache.a, b = cache.b;
      if (!a || !b || !B) return;
      const x = ease.simetrica(e.p);
      const arco = (op.arco || 0) * Math.sin(Math.PI * x);
      const dx = b.cx - a.cx, dy = b.cy - a.cy;
      const len = Math.hypot(dx, dy) || 1;
      const c = [lerp(a.cx, b.cx, x) - (dy / len) * arco, lerp(a.cy, b.cy, x) + (dx / len) * arco];
      const sA = logLerp(1, b.l / a.l, x);
      const sB = logLerp(a.l / b.l, 1, x);
      A.posar({ s: sA, x: c[0] - sA * a.cx, y: c[1] - sA * a.cy });
      B.posar({ s: sB, x: c[0] - sB * b.cx, y: c[1] - sB * b.cy });
      B.estilo({ o: ease.inOutSine(prog(e.p, 0.12, 0.88)) });
    },
  });

  /* ── C1.3: tudo converge num ponto e vira um ponto de luz macio ──
     A luz nasce no ponto exato (op.ponto, ou o centro do data-ponte da próxima). O brilho sobe só
     no conteúdo (o fundo da cena não clareia) e o que sai apaga antes de a convergência parar. */
  Motion.transicao('ponto-de-luz', {
    medir(op) {
      return op.ponte ? [['B', selPonte(op.ponte), 'inicio']] : [];
    },
    preparar(A, B, op, cache) {
      const b = op.ponte && B ? B.medida(selPonte(op.ponte), 'inicio') : null;
      cache.P = op.ponto || (b ? [b.cx, b.cy] : [0, 0]);
    },
    aplicar(e, A, B, op, cache) {
      const P = cache.P;
      const q = prog(e.p, 0, 0.62);
      const S = logLerp(1, 0.14, ease.inCubic(q));
      A.posar({ s: S, x: P[0] - S * P[0], y: P[1] - S * P[1] });
      A.estilo({ blur: 0.7 * q, oConteudo: 1 - suave(prog(q, 0.35, 0.85)), brilho: 1 + 1.3 * suave(q * 1.6) });
      // o ponto de luz: nasce enquanto tudo converge e apaga (ou vira o começo de B)
      const forca = suave(prog(e.p, 0.25, 0.6)) * (1 - suave(prog(e.p, 0.62, 0.98)));
      if (forca > 0.002) {
        const px = u();
        const diam = (6 + 10 * suave(prog(e.p, 0.2, 0.62))) * px;
        const cx = (50 + P[0]) * px, cy = (H() / 2 + P[1]) * px;
        const luz = Motion.camada('luz');
        const grad = A.api.fx.gradienteDeLuz(op.cor || 'var(--luz-1, var(--destaque, #fff))', 1, { forma: 'circle', ate: 50 });
        // inset:auto vem ANTES de left/top (depois, ele zeraria a posição e a luz iria para o canto)
        luz.style.cssText = `display:block;inset:auto;left:${(cx - diam / 2).toFixed(1)}px;top:${(cy - diam / 2).toFixed(1)}px;width:${diam.toFixed(1)}px;height:${diam.toFixed(1)}px;background:${grad};opacity:${forca.toFixed(4)};mix-blend-mode:plus-lighter`;
        luz.dataset.centro = `${cx.toFixed(1)},${cy.toFixed(1)}`;
      }
      if (B) B.estilo({ o: suave(prog(e.p, 0.58, 1)) });
    },
  });

  /* ── C1.6: a câmera atravessa a composição ── */
  Motion.transicao('atravessar', {
    aplicar(e, A, B, op) {
      const ate = op.ate ?? 4;
      const p = e.p;
      const S = Math.exp(Math.log(ate) * (0.3 * p + 0.7 * p * p));
      A.posar({ s: S });
      A.estilo({ blur: 0.9 * p * p, o: 1 - suave(prog(p, 0.5, 0.92)) });
      if (B) {
        const x = prog(p, 0.45, 1);
        B.posar({ s: lerp(0.95, 1, ease.outCubic(x)) });
        B.estilo({ o: suave(x / 0.7) });
      } else veu('var(--fundo)', suave(prog(p, 0.6, 1)));
    },
  });

  /* ── flash sem ataque seco ── */
  Motion.transicao('flash', {
    aplicar(e, A, B, op) {
      const cor = op.cor || 'var(--texto, #fff)';
      const forca = op.forca ?? 0.85;
      const o = e.lado === 'A' ? forca * suave(e.pA) : forca * (1 - ease.outCubic(e.pB));
      const v = Motion.camada('luz');
      v.style.cssText = `display:block;background:${cor};opacity:${clamp(o).toFixed(4)}`;
    },
  });

  /* ── lâmina de luz: luz que SOMA, larga e sem borda, varre o quadro; B aparece presa a ela ──
     O conteúdo de A apaga antes de a lâmina chegar (a lâmina nunca corta uma palavra ao meio). A luz
     é mais forte no primeiro terço do caminho e enfraquece ao atravessar: escolha o ângulo para ela
     chegar ao herói de B (rosto, produto) já fraca. angulo 100 = da esquerda para a direita;
     280 = da direita para a esquerda; 190 = de cima para baixo. */
  Motion.transicao('lamina-de-luz', {
    aplicar(e, A, B, op) {
      const ang = op.angulo ?? 100;
      const larg = op.largura ?? 16; // % do quadro: a meia-largura da luz
      const soft = op.suavidade ?? 16; // % do quadro: a borda da máscara de B
      const forca = op.forca ?? 0.42;
      const x = ease.inOutSine(e.p);
      const pos = lerp(-soft - larg, 100 + soft + larg, x);
      A.estilo({ oConteudo: 1 - suave(prog(e.p, 0.02, 0.32)) });
      if (B) {
        const ps = [];
        for (let i = 0; i <= 8; i++) {
          const k = i / 8;
          ps.push(`rgba(0,0,0,${(1 - suave5(k)).toFixed(4)}) ${(pos - soft + 2 * soft * k).toFixed(2)}%`);
        }
        B.estilo({ mask: `linear-gradient(${ang}deg, ${ps.join(', ')})` });
      }
      const cor = op.cor || 'var(--luz-1, var(--destaque, #fff))';
      const ps = [];
      for (let i = -10; i <= 10; i++) {
        const k = i / 10;
        const a = (Math.exp(-4.5 * k * k) - Math.exp(-4.5)) / (1 - Math.exp(-4.5)); // chega a zero liso na ponta
        ps.push(`color-mix(in srgb, ${cor} ${(a * 100).toFixed(1)}%, transparent) ${(pos + k * larg).toFixed(2)}%`);
      }
      const v = Motion.camada('luz');
      const o = forca * Math.pow(Math.sin(Math.PI * clamp(e.p)), 1.4) * (1 - 0.55 * x);
      v.style.cssText = `display:block;background:linear-gradient(${ang}deg, transparent ${(pos - larg * 1.05).toFixed(2)}%, ${ps.join(', ')}, transparent ${(pos + larg * 1.05).toFixed(2)}%);opacity:${o.toFixed(4)};mix-blend-mode:plus-lighter`;
    },
  });

  /* ── íris muito esfumada (desencorajada: prefira esmaecer) ── */
  Motion.transicao('iris', {
    aplicar(e, A, B, op) {
      if (!B) return;
      const P = op.ponto || [0, 0];
      const cx = 50 + P[0], cy = ((H() / 2 + P[1]) / H()) * 100;
      const raio = lerp(0, 160, ease.inOutCubic(e.p));
      const suav = Math.max(45, raio * 0.6);
      const ps = [];
      for (let i = 0; i <= 8; i++) {
        const x = i / 8;
        ps.push(`rgba(0,0,0,${(1 - suave5(x)).toFixed(4)}) ${(Math.max(0, raio - suav / 2) + suav * x).toFixed(2)}%`);
      }
      B.estilo({ mask: `radial-gradient(circle at ${cx.toFixed(2)}% ${cy.toFixed(2)}%, ${ps.join(', ')})` });
    },
  });
})();

<script>/* player.js — o player do filme no navegador (fora do modo captura).
   Teclas: espaço toca/pausa · ←/→ um quadro · Shift+←/→ um segundo · [ ] cena anterior/próxima ·
   L repete a cena · A área segura · F tela cheia. A prévia ao vivo pode perder quadros numa cena
   pesada: o MP4 renderizado é a verdade. */
(function () {
  'use strict';
  const params = new URLSearchParams(location.search);

  function fmt(t) {
    const m = Math.floor(t / 60);
    const s = t - m * 60;
    return `${String(m).padStart(2, '0')}:${s.toFixed(2).padStart(5, '0').replace('.', ',')}`;
  }

  function montar() {
    const L = Motion.linha;
    const palco = Motion.palco;
    document.body.classList.add('m-com-player');
    const moldura = document.createElement('div');
    moldura.id = 'm-moldura';
    palco.parentNode.insertBefore(moldura, palco);
    moldura.appendChild(palco);

    const barra = document.createElement('div');
    barra.id = 'm-player';
    barra.innerHTML = `
      <div class="m-regua"><div class="m-cenas"></div><div class="m-batidas"></div><input type="range" min="0" step="0.0001" value="0" aria-label="Tempo"><div class="m-cabeca"></div></div>
      <div class="m-controles">
        <button data-a="anterior" title="Cena anterior ([)">⏮</button>
        <button data-a="tocar" class="m-tocar" title="Tocar / pausar (espaço)">Tocar</button>
        <button data-a="proxima" title="Próxima cena (])">⏭</button>
        <span class="m-tempo"></span>
        <span class="m-cena-atual"></span>
        <span class="m-espaco"></span>
        <button data-a="repetir" title="Repetir a cena (L)">Repetir cena</button>
        <select data-a="velocidade" title="Velocidade"><option value="1">1×</option><option value="0.5">0,5×</option><option value="0.25">0,25×</option></select>
        <button data-a="seguro" title="Área segura (A)">Área segura</button>
        <button data-a="cheia" title="Tela cheia (F)">⤢</button>
      </div>`;
    document.body.appendChild(barra);

    const regua = barra.querySelector('.m-regua');
    const faixa = barra.querySelector('.m-cenas');
    const input = barra.querySelector('input');
    const cabeca = barra.querySelector('.m-cabeca');
    const lblTempo = barra.querySelector('.m-tempo');
    const lblCena = barra.querySelector('.m-cena-atual');
    const btTocar = barra.querySelector('.m-tocar');
    input.max = String(L.total);

    L.cenas.forEach((c, i) => {
      const d = document.createElement('div');
      d.className = 'm-cena-faixa';
      d.style.left = `${(c.inicio / L.total) * 100}%`;
      d.style.width = `${(c.dur / L.total) * 100}%`;
      d.innerHTML = `<span>${String(i + 1).padStart(2, '0')} ${c.titulo || c.id}</span>`;
      d.title = `${c.titulo || c.id} · ${fmt(c.inicio)}`;
      faixa.appendChild(d);
    });
    const bat = barra.querySelector('.m-batidas');
    const passo = 60 / (L.bpm || 120);
    for (let t = 0; t <= L.total + 1e-6; t += passo) {
      const b = document.createElement('i');
      b.style.left = `${(t / L.total) * 100}%`;
      bat.appendChild(b);
    }

    let tocando = false, t = 0, ultimo = 0, velocidade = 1, repetir = null, seguro = false;
    const ajustar = () => {
      const W = palco.offsetWidth, H = palco.offsetHeight;
      const altBarra = barra.offsetHeight + 16;
      const s = Math.min((innerWidth - 24) / W, (innerHeight - altBarra - 16) / H);
      palco.style.transform = `scale(${s})`;
      moldura.style.width = `${W * s}px`;
      moldura.style.height = `${H * s}px`;
    };
    ajustar();
    addEventListener('resize', ajustar);

    const cenaEm = (tt) => {
      let atual = L.cenas[0];
      for (const c of L.cenas) if (tt >= c.inicio - 1e-6) atual = c;
      return atual;
    };
    const mostrar = (tt) => {
      t = Math.max(0, Math.min(L.total, tt));
      Motion.ir(t);
      input.value = String(t);
      cabeca.style.left = `${(t / L.total) * 100}%`;
      const q = Math.round(t * L.fps);
      lblTempo.textContent = `${fmt(t)} · quadro ${q}`;
      const c = cenaEm(t);
      lblCena.textContent = `${String(L.cenas.indexOf(c) + 1).padStart(2, '0')} · ${c.titulo || c.id} · ${(t - c.inicio).toFixed(2).replace('.', ',')} s`;
    };
    const laco = (agora) => {
      if (!tocando) return;
      const dt = Math.min(0.1, (agora - ultimo) / 1000) * velocidade;
      ultimo = agora;
      let nt = t + dt;
      if (repetir) {
        if (nt >= repetir.inicio + repetir.dur) nt = repetir.inicio;
      } else if (nt > L.total) nt = 0;
      mostrar(nt);
      requestAnimationFrame(laco);
    };
    const alternar = () => {
      tocando = !tocando;
      btTocar.textContent = tocando ? 'Pausar' : 'Tocar';
      if (tocando) {
        ultimo = performance.now();
        requestAnimationFrame(laco);
      }
    };
    const pararE = (fn) => {
      tocando = false;
      btTocar.textContent = 'Tocar';
      fn();
    };
    const irCena = (dir) => {
      const i = L.cenas.indexOf(cenaEm(t + 1e-4));
      const alvo = L.cenas[Math.max(0, Math.min(L.cenas.length - 1, i + dir))];
      mostrar(alvo.inicio);
    };
    let caixaSeguro = null;
    const alternarSeguro = () => {
      seguro = !seguro;
      if (!caixaSeguro) {
        caixaSeguro = document.createElement('div');
        caixaSeguro.className = 'm-seguro';
        const f = Motion.FORMATOS[L.formato];
        caixaSeguro.style.left = `${f.seguro.x * 100}%`;
        caixaSeguro.style.right = `${f.seguro.x * 100}%`;
        caixaSeguro.style.top = `${f.seguro.topo * 100}%`;
        caixaSeguro.style.bottom = `${f.seguro.base * 100}%`;
        palco.appendChild(caixaSeguro);
      }
      caixaSeguro.style.display = seguro ? 'block' : 'none';
    };

    barra.addEventListener('click', (ev) => {
      const a = ev.target.closest('[data-a]')?.dataset.a;
      if (a === 'tocar') alternar();
      if (a === 'anterior') pararE(() => irCena(-1));
      if (a === 'proxima') pararE(() => irCena(1));
      if (a === 'repetir') {
        repetir = repetir ? null : cenaEm(t + 1e-4);
        ev.target.classList.toggle('m-ligado', !!repetir);
        if (repetir) mostrar(repetir.inicio);
      }
      if (a === 'seguro') {
        alternarSeguro();
        ev.target.classList.toggle('m-ligado', seguro);
      }
      if (a === 'cheia') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
    });
    barra.querySelector('select').addEventListener('change', (ev) => (velocidade = parseFloat(ev.target.value)));
    input.addEventListener('input', () => pararE(() => mostrar(parseFloat(input.value))));
    regua.addEventListener('dblclick', (ev) => {
      const c = ev.target.closest('.m-cena-faixa');
      if (c) pararE(() => mostrar(L.cenas[[...faixa.children].indexOf(c)].inicio));
    });
    addEventListener('keydown', (ev) => {
      if (ev.target.tagName === 'SELECT') return;
      const q = 1 / L.fps;
      if (ev.key === ' ') {
        ev.preventDefault();
        alternar();
      } else if (ev.key === 'ArrowRight') pararE(() => mostrar(t + (ev.shiftKey ? 1 : q)));
      else if (ev.key === 'ArrowLeft') pararE(() => mostrar(t - (ev.shiftKey ? 1 : q)));
      else if (ev.key === ']') pararE(() => irCena(1));
      else if (ev.key === '[') pararE(() => irCena(-1));
      else if (ev.key.toLowerCase() === 'l') barra.querySelector('[data-a="repetir"]').click();
      else if (ev.key.toLowerCase() === 'a') barra.querySelector('[data-a="seguro"]').click();
      else if (ev.key.toLowerCase() === 'f') barra.querySelector('[data-a="cheia"]').click();
    });

    mostrar(parseFloat((params.get('t') || '0').replace(',', '.')) || 0);
    if (params.has('play')) alternar();
    if (params.has('seguro')) alternarSeguro();
  }

  window.MotionPlayer = { montar };
})();

//# sourceURL=motor/player.js</script>
<script>/* _comum.js — o mundo de Vice City ao pôr do sol, dividido por todas as cenas.
   Fio condutor: a linha do horizonte. Ela abre o filme, vira o chão de onde as torres de dinheiro
   sobem e é onde o sol se põe no fim.
   Vice.cenario({ sol, palmas, skyline }) → HTML das camadas (céu, sol, mar, skyline, palmeiras).
   Vice.torre({ classe, rotulo, valor, nota }) → um paralelepípedo 3D (CSS preserve-3d) com a altura
   em --h; o rótulo viaja no topo, sempre de frente para a câmera. */
(function () {
  const rnd = (i, k) => {
    const x = Math.sin((i + 1) * 127.1 + k * 311.7) * 43758.5453;
    return x - Math.floor(x);
  };

  // silhueta da cidade (prédios retangulares com alguns topos de antena), viewBox 1000×120
  function skyline(semente, largura = 1000) {
    let x = 0, i = 0, d = '';
    while (x < largura) {
      const w = 14 + rnd(i, semente) * 34;
      const alto = rnd(i, semente + 1) < 0.18;
      const h = alto ? 60 + rnd(i, semente + 2) * 55 : 12 + rnd(i, semente + 3) * 42;
      d += `M${x.toFixed(1)} 120V${(120 - h).toFixed(1)}H${(x + w).toFixed(1)}V120Z`;
      if (alto && rnd(i, semente + 4) < 0.5) {
        const ax = x + w / 2;
        d += `M${(ax - 0.8).toFixed(1)} ${(120 - h).toFixed(1)}V${(120 - h - 14).toFixed(1)}H${(ax + 0.8).toFixed(1)}V${(120 - h).toFixed(1)}Z`;
      }
      x += w + rnd(i, semente + 5) * 3;
      i++;
    }
    return `<svg class="skyline-svg" viewBox="0 0 ${largura} 120" preserveAspectRatio="none"><path d="${d}"/></svg>`;
  }

  // palmeira em silhueta: tronco curvo e folhas que caem em arco. viewBox 400×800, base no (200,800)
  function palmeira(semente, inclina = 1) {
    const topo = [200 + inclina * (60 + rnd(1, semente) * 50), 120 + rnd(2, semente) * 40];
    const ctrl = [200 + inclina * (-10 + rnd(3, semente) * 20), 420];
    // tronco: duas curvas paralelas, afinando
    const tronco = `M${190} 800 Q${ctrl[0] - 12} ${ctrl[1]} ${topo[0] - 6} ${topo[1]} L${topo[0] + 6} ${topo[1]} Q${ctrl[0] + 12} ${ctrl[1]} ${214} 800 Z`;
    // anéis do tronco
    let aneis = '';
    for (let k = 1; k < 16; k++) {
      const u = k / 16;
      const x = (1 - u) * (1 - u) * 202 + 2 * u * (1 - u) * ctrl[0] + u * u * topo[0];
      const y = (1 - u) * (1 - u) * 800 + 2 * u * (1 - u) * ctrl[1] + u * u * topo[1];
      aneis += `M${(x - 11 + u * 5).toFixed(1)} ${y.toFixed(1)}h${(22 - u * 10).toFixed(1)}`;
    }
    // folhas: cada uma é uma nervura que sai do topo e cai em arco, com folíolos finos penteados para trás
    let nervuras = '', foliolos = '';
    const n = 11;
    for (let f = 0; f < n; f++) {
      const ang = -Math.PI * 1.08 + (f / (n - 1)) * Math.PI * 1.16 + (rnd(f, semente + 7) - 0.5) * 0.2;
      const comp = 150 + rnd(f, semente + 8) * 80;
      const lado = Math.cos(ang);
      const ex = topo[0] + lado * comp;
      const ey = topo[1] + 40 + comp * (0.55 + 0.35 * Math.abs(Math.sin(ang * 0.5 + 0.8)));
      const cx = topo[0] + lado * comp * 0.6;
      const cy = topo[1] - 30 - rnd(f, semente + 9) * 40 + Math.max(0, Math.sin(ang)) * 60;
      const P = (u) => [(1 - u) * (1 - u) * topo[0] + 2 * u * (1 - u) * cx + u * u * ex, (1 - u) * (1 - u) * topo[1] + 2 * u * (1 - u) * cy + u * u * ey];
      nervuras += `M${topo[0].toFixed(1)} ${topo[1].toFixed(1)}Q${cx.toFixed(1)} ${cy.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}`;
      const M = 22;
      for (let s = 1; s < M; s++) {
        const u = s / M;
        const [x, y] = P(u);
        const [x2, y2] = P(Math.min(1, u + 0.02));
        let tx = x2 - x, ty = y2 - y;
        const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
        const nx = -ty, ny = tx;
        const larg = Math.sin(Math.PI * Math.min(1, 0.15 + u * 0.95)) * 46;
        for (const sg of [1, -1]) {
          // o folíolo cai: aponta para fora e para baixo, penteado para a ponta
          const qx = x + (nx * sg * 0.75 + tx * 0.55) * larg;
          const qy = y + (ny * sg * 0.75 + ty * 0.55) * larg + larg * 0.35;
          foliolos += `M${x.toFixed(1)} ${y.toFixed(1)}L${qx.toFixed(1)} ${qy.toFixed(1)}`;
        }
      }
    }
    // cacho de cocos no topo
    const cocos = [0, 1, 2].map((k) => `M${(topo[0] - 10 + k * 10).toFixed(1)} ${(topo[1] + 12).toFixed(1)}a7 7 0 1 0 0.1 0Z`).join('');
    return `<svg class="palma-svg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMax meet"><path d="${tronco}"/><path d="${aneis}" class="aneis"/><path d="${nervuras}" class="nervura"/><path d="${foliolos}" class="foliolo"/><path d="${cocos}"/></svg>`;
  }

  window.Vice = {
    cenario({ sol = true, palmas = true, skyline: comCidade = true, classe = '' } = {}) {
      return `
      <div class="vice ${classe}">
        <div class="plano ceu"></div>
        ${sol ? '<div class="sol-brilho"></div><div class="sol"></div>' : ''}
        ${comCidade ? `<div class="skyline skyline-longe">${skyline(3, 1400)}</div><div class="skyline skyline-perto">${skyline(11)}</div>` : ''}
        <div class="mar"><div class="reflexo"></div><div class="ondas"></div></div>
        <div class="horizonte-luz"></div>
        ${palmas ? `<div class="palmas palmas-esq">${palmeira(2, 1)}${palmeira(5, 0.6)}</div><div class="palmas palmas-dir">${palmeira(8, -1)}${palmeira(13, -0.5)}</div>` : ''}
      </div>`;
    },
    torre({ classe = '', rotulo = '', valor = '', nota = '' } = {}) {
      return `
      <div class="torre ${classe}">
        <div class="face f-frente"></div><div class="face f-tras"></div>
        <div class="face f-dir"></div><div class="face f-esq"></div>
        <div class="face f-topo"></div>
        <div class="torre-rotulo"><span class="t-nome">${rotulo}</span><span class="t-valor destaque">${valor}</span>${nota ? `<span class="t-nota">${nota}</span>` : ''}</div>
      </div>`;
    },
    /** Pega as peças do cenário (no montar). */
    pecas(el) {
      return {
        vice: el.$('.vice'), ceu: el.$('.ceu'), sol: el.$('.sol'), brilho: el.$('.sol-brilho'), mar: el.$('.mar'),
        reflexo: el.$('.reflexo'), ondas: el.$('.ondas'), linha: el.$('.horizonte-luz'),
        sky: el.$$('.skyline'), palmas: el.$$('.palmas'), palmeiras: el.$$('.palma-svg'),
      };
    },
    /** Vida do cenário: o sol respira, o mar cintila e corre, as palmeiras balançam. Função pura de t. */
    vida(t, V, api, { k = 1, sol = 1 } = {}) {
      const S = Math.sin, PI2 = Math.PI * 2;
      if (V.brilho) api.set(V.brilho, { o: sol * (0.9 + 0.1 * k * S(PI2 * t / 4.3)), s: 1 + 0.025 * k * S(PI2 * t / 5.1 + 1) });
      if (V.reflexo) api.set(V.reflexo, { o: sol * (0.82 + 0.18 * S(PI2 * t / 1.9)), sx: 1 + 0.12 * S(PI2 * t / 2.7) });
      if (V.ondas) V.ondas.style.backgroundPosition = `0 ${(t * 0.9).toFixed(4)}cqh`;
      V.palmeiras.forEach((p, i) => api.set(p, { r: (i % 2 ? -1 : 1) * 0.9 * k * S(PI2 * (t + i * 0.83) / (3.6 + i * 0.4)) }));
    },
  };
})();

<script>/* abertura — "O gancho" (4 s)
   Ideia: o horizonte acende do preto, o céu de Vice City queima de baixo para cima e a pergunta
   sobe gigante sobre o pôr do sol.
   Batidas: 0 linha do horizonte · 0,4 céu e sol · 0,75 palmeiras e cidade · b(2) "QUANTO CUSTOU" ·
   b(3) "GTA VI?" pela lente · 2,8 brilho · saída avancar-desfocar. */
Motion.cena('abertura', {
  render: () => `
    ${Vice.cenario()}
    <div class="pilha bloco">
      <p class="titulo pergunta">Quanto custou</p>
      <h1 class="titulo gta"><span class="destaque">GTA VI?</span></h1>
    </div>`,
  poses: {
    inicio: (el, api) => {
      api.set(el.$('.ceu'), { o: 0.08 });
      api.set([el.$('.sol'), el.$('.sol-brilho'), el.$('.mar'), ...el.$$('.skyline'), ...el.$$('.palmas'), el.$('.bloco')], { o: 0 });
      api.set(el.$('.horizonte-luz'), { sx: 0.35 });
    },
    meio: (el, api) => {
      api.set(el.$('.gta'), { o: 0 });
      api.set(el.$('.sol'), { y: 6 });
      api.set(el.$$('.palmas'), { y: 12 });
    },
  },
  montar(el, api) {
    el.V = Vice.pecas(el);
    el.pal = api.tipo.dividir(el.$('.pergunta'), { por: 'palavra' });
    el.gta = api.tipo.dividir(el.$('.gta'), { por: 'letra' });
    el.cam = api.camera();
  },
  quadro(t, el, api) {
    const { prog, ease, lerp, suave, tipo, b } = api;
    const V = el.V;
    // 0 → 0,6: a linha do horizonte nasce como ponto e corre para as pontas
    api.set(V.linha, { sx: lerp(0.015, 1, ease.forte(prog(t, 0, 0.75))), o: suave(prog(t, 0, 0.12)) });
    // o céu queima de baixo para cima (máscara que sobe) e ganha força
    const c = ease.inOutSine(prog(t, 0.25, 1.5));
    const borda = lerp(-30, 110, c);
    api.set(V.ceu, { o: suave(prog(t, 0.2, 0.5)), style: { webkitMaskImage: `linear-gradient(0deg, #000 ${borda}%, transparent ${borda + 30}%)`, maskImage: `linear-gradient(0deg, #000 ${borda}%, transparent ${borda + 30}%)` } });
    api.set(V.mar, { o: suave(prog(t, 0.15, 0.7)) });
    // o sol sobe meia altura do mar
    const s = ease.forte(prog(t, 0.4, 1.7));
    api.set(V.sol, { y: lerp(5.5, 0, s), o: suave(prog(t, 0.4, 0.75)) });
    const kSol = suave(prog(t, 0.45, 1.4));
    // a cidade e as palmeiras sobem com paralaxe
    V.sky.forEach((k, i) => api.set(k, { y: lerp(1.2 + i, 0, ease.forte(prog(t, 0.7 + 0.1 * i, 1.6))), o: suave(prog(t, 0.7 + 0.1 * i, 1.1)) }));
    V.palmas.forEach((p, i) => api.set(p, { y: lerp(26, 0, ease.forte(prog(t, 0.75 + 0.08 * i, 2.0))), o: suave(prog(t, 0.75, 0.95)) }));
    Vice.vida(t, V, api, { sol: kSol });
    // a pergunta
    api.set(el.$('.bloco'), { o: 1 });
    tipo.focar(t, el.pal, { inicio: b(2) });
    tipo.lente(t, el.gta, { inicio: b(3), eixo: 'quadro' });
    tipo.brilho(t, el.gta, { inicio: 2.8, dur: 0.8, forca: 0.45 });
    tipo.derivaDestaque(t, el.gta, { inicio: 2.0 });
    // câmera: nasce baixa, rente ao mar, e sobe; depois push-in vivo
    const tilt = ease.forte(prog(t, 0, 2.2));
    el.cam.pose({ zoom: api.viva(t) * lerp(1.06, 1, tilt), y: lerp(7, 0, tilt) * api.k });
  },
});

<script>/* gta5 — "O antes · GTA V" (5,5 s)
   Ideia: em 2013, a torre de dinheiro de GTA V sobe da linha do mar, maço por maço, girando,
   e o valor viaja no topo dela.
   Batidas: 0 "2013" assenta · b(1) a torre rompe o mar · b(2) rótulo + contagem (trava em b(4)) ·
   b(5) nota · hold girando · saída empurrar para cima. */
Motion.cena('gta5', {
  render: () => `
    ${Vice.cenario({ classe: 'baixo' })}
    <div class="ano titulo" aria-hidden="true">2013</div>
    <div class="palco3d">${Vice.torre({ classe: 't5', rotulo: 'GTA V · 2013', valor: 'US$ 265 mi', nota: 'desenvolvimento + marketing' })}</div>`,
  poses: {
    inicio: (el, api) => {
      api.set(el.$('.t5'), { vars: { '--h': '1cqmin', '--ry': '-70deg' } });
      api.set(el.$('.torre-rotulo'), { o: 0 });
      api.set(el.$('.ano'), { o: 0.3, s: 1.1 });
    },
    meio: (el, api) => {
      api.set(el.$('.t5'), { vars: { '--h': '18cqmin', '--ry': '-48deg' } });
      api.set(el.$('.t-nota'), { o: 0 });
    },
  },
  montar(el, api) {
    el.V = Vice.pecas(el);
    el.torre = el.$('.t5');
    el.cam = api.camera();
  },
  quadro(t, el, api) {
    const { prog, ease, lerp, suave, b } = api;
    const ini = api.inicioEntrada(0);
    Vice.vida(t, el.V, api);
    // "2013" vazado assenta devagar no céu
    const a = ease.forte(prog(t, ini, 1.6));
    api.set(el.$('.ano'), { s: lerp(1.12, 1, a) * (1 + 0.004 * (t - api.ref)), o: suave(prog(t, ini, ini + 0.4)) });
    // a torre rompe o mar e sobe, com uma mola curta de objeto
    const h = (api.vertical ? 64 : 36) * api.spring(t - b(1), { freq: 0.9, damp: 5.6 });
    const ry = lerp(-70, -32, ease.forte(prog(t, 0.2, 2.6))) + 2 * (t - api.ref);
    api.set(el.torre, { vars: { '--h': `${Math.max(0.3, h).toFixed(3)}cqmin`, '--ry': `${ry.toFixed(3)}deg` } });
    // o rótulo nasce no topo; o valor conta e trava na batida
    const r = ease.forte(prog(t, b(2), b(2) + 0.6));
    api.set(el.$('.torre-rotulo'), { o: suave(prog(t, b(2), b(2) + 0.2)) });
    api.set(el.$('.t-nome'), { y: 1.2 * (1 - r), blur: 0.3 * (1 - r) });
    api.tipo.contar(t, el.$('.t-valor'), { de: 0, ate: 265, inicio: b(2), travar: b(4), prefixo: 'US$ ', sufixo: ' mi' });
    const n = ease.forte(prog(t, b(5), b(5) + 0.6));
    api.set(el.$('.t-nota'), { o: suave(prog(t, b(5), b(5) + 0.2)), y: 0.8 * (1 - n), blur: 0.25 * (1 - n) });
    // câmera: push-in contínuo de ~4 %
    el.cam.pose({ zoom: 1 + 0.008 * (t - api.ref) });
  },
});

<script>/* recorde — "O recorde" (3 s)
   Ideia: a câmera chega ao céu e a frase do recorde chega letra a letra; "mais caro" acende no degradê.
   Batidas: 0 etiqueta · b(0,5) frase · b(1,5) varredura do destaque · b(4) brilho · saída empurrar para baixo. */
Motion.cena('recorde', {
  render: (c) => `
    ${Vice.cenario({ classe: 'ceu-alto' })}
    <div class="pilha bloco">
      <p class="etiqueta">Na época, foi</p>

    </div>`,
  poses: {
    inicio: (el, api) => { api.set(el.$('.frase'), { o: 0.2, blur: 1, y: 2 }); api.set(el.$('.etiqueta'), { o: 0 }); },
  },
  montar(el, api) {
    el.V = Vice.pecas(el);
    el.et = api.tipo.dividir(el.$('.etiqueta'), { por: 'palavra' });
    el.letras = api.tipo.dividir(el.$('.frase'), { por: 'letra' });
    el.dest = el.letras.filter((p) => p.destaque);
    el.cam = api.camera();
  },
  quadro(t, el, api) {
    const { tipo, b } = api;
    const ini = api.inicioEntrada(0.02);
    Vice.vida(t, el.V, api);
    tipo.focar(t, el.et, { inicio: ini });
    tipo.focar(t, el.letras, { inicio: b(0.5), cascata: 0.022 });
    tipo.varrerDestaque(t, el.letras, { inicio: b(1.5), dur: 0.5 });
    tipo.brilho(t, el.dest, { inicio: b(4), dur: 0.7, forca: 0.45 });
    tipo.derivaDestaque(t, el.letras, { inicio: b(3) });
    el.cam.pose({ zoom: 1 + 0.01 * (t - api.ref) });
  },
});

<script>/* gta6 — "O agora · GTA VI" (6,5 s)
   Ideia: a torre de GTA VI rompe a linha do mar e não para de subir: fura o topo do quadro, e o
   número sai de onde GTA V parou (265 mi) e rola até 2.000 mi, virando "2 bi".
   Batidas: 0 a torre rompe · 1,0 fura o quadro (tremor) · b(2,5) etiqueta · b(3,5) contagem (trava em b(6))
   · b(6,5) "até" + nota · hold: a torre segue subindo · saída avancar-desfocar. */
Motion.cena('gta6', {
  render: () => `
    ${Vice.cenario({ classe: 'baixo' })}
    <div class="palco3d">${Vice.torre({ classe: 't6' })}</div>
    <div class="texto">
      <p class="etiqueta">GTA VI</p>
      <p class="apoio-n">até</p>
      <h2 class="titulo valor"><span class="destaque">US$ 2 bi</span></h2>
      <p class="nota">estimativas de US$ 1 a 2 bilhões</p>
    </div>`,
  poses: {
    inicio: (el, api) => {
      api.set(el.$('.t6'), { vars: { '--h': '30cqmin' } });
      api.set(el.$('.texto'), { o: 0 });
    },
    meio: (el, api) => {
      api.set(el.$('.t6'), { vars: { '--h': '70cqmin' } });
      api.set([el.$('.valor'), el.$('.nota'), el.$('.apoio-n')], { o: 0 });
    },
  },
  montar(el, api) {
    el.V = Vice.pecas(el);
    el.torre = el.$('.t6');
    el.valor = el.$('.valor .destaque');
    el.cam = api.camera();
  },
  quadro(t, el, api) {
    const { prog, ease, lerp, suave, b } = api;
    Vice.vida(t, el.V, api);
    // a torre: rompe o mar acelerando, fura o topo e segue subindo devagar
    const sobe = ease.inOutCubic(prog(t, 0, 1.6));
    const h = 4 + (api.vertical ? 216 : 136) * sobe + 3 * Math.max(0, t - 1.6);
    const ry = lerp(-44, -26, ease.forte(prog(t, 0, 2.4))) + 1.5 * (t - api.ref);
    api.set(el.torre, { vars: { '--h': `${h.toFixed(3)}cqmin`, '--ry': `${ry.toFixed(3)}deg` } });
    // texto
    const surge = (sel, t0, dy = 1.2) => {
      const e = ease.forte(prog(t, t0, t0 + 0.6));
      api.set(el.$(sel), { o: suave(prog(t, t0, t0 + 0.2)), y: dy * (1 - e), blur: 0.4 * (1 - e) });
    };
    api.set(el.$('.texto'), { o: 1 });
    surge('.etiqueta', b(2.5));
    surge('.apoio-n', b(6.5));
    surge('.nota', b(6.5) + 0.1);
    // contagem: de onde GTA V parou até 2.000 mi; na batida b(6) vira "2 bi" com um respiro de foco
    const troca = b(6) + 0.08;
    if (t < troca) api.tipo.contar(t, el.valor, { de: 265, ate: 2000, inicio: b(3.5), travar: b(6), prefixo: 'US$ ', sufixo: ' mi' });
    else el.valor.textContent = 'US$ 2 bi';
    const pulso = Math.sin(Math.PI * prog(t, b(6) - 0.04, b(6) + 0.2));
    const foco = 1 - ease.forte(prog(t, b(3.5), b(3.5) + 0.6));
    const ev = ease.forte(prog(t, b(3.5), b(3.5) + 0.6));
    api.set(el.$('.valor'), { o: suave(prog(t, b(3.5), b(3.5) + 0.2)), y: 1.6 * (1 - ev), blur: 0.25 * pulso + 0.4 * foco, bright: 1 + 0.5 * pulso });
    // câmera: contra-plongée viva; tremor curto quando a torre fura o quadro
    const tr = api.tremor(t, 1.0, { forca: 0.25 });
    el.cam.pose({ zoom: 1 + 0.008 * (t - api.ref), x: tr.x, y: tr.y, giro: tr.giro });
  },
});

<script>/* comparacao — "A comparação" (6 s)
   Ideia: a câmera recua e as duas torres aparecem lado a lado na proporção real
   (265 milhões contra até 2 bilhões): a pequena some ao pé da gigante, e o "7x" crava.
   Batidas: 0 recuo da câmera · b(1) GTA VI sobe 7,5× · b(3,5) "até" · b(4) "7x" pela lente + peso ·
   b(5) "mais caro" · b(8) brilho · b(10) o sol começa a afundar · saída esmaecer. */
Motion.cena('comparacao', {
  render: () => `
    ${Vice.cenario({ classe: 'baixo' })}
    <div class="palco3d">
      ${Vice.torre({ classe: 'c5', rotulo: 'GTA V', valor: 'US$ 265 mi' })}
      ${Vice.torre({ classe: 'c6', rotulo: 'GTA VI', valor: 'até US$ 2 bi' })}
    </div>
    <div class="texto">
      <p class="titulo ate">até</p>
      <h2 class="titulo vezes"><span class="destaque">7x</span></h2>
      <p class="titulo mais">mais caro</p>
    </div>`,
  poses: {
    inicio: (el, api) => {
      api.set(el.$('.c6'), { vars: { '--h': '0.5cqmin' } });
      api.set(el.$('.c6 .torre-rotulo'), { o: 0 });
      api.set(el.$('.texto'), { o: 0 });
    },
    meio: (el, api) => {
      api.set(el.$('.vezes'), { o: 0, blur: 1 });
      api.set(el.$('.mais'), { o: 0 });
    },
  },
  montar(el, api) {
    el.V = Vice.pecas(el);
    el.c5 = el.$('.c5');
    el.c6 = el.$('.c6');
    el.ate = api.tipo.dividir(el.$('.ate'), { por: 'palavra' });
    el.vezes = api.tipo.dividir(el.$('.vezes'), { por: 'letra' });
    el.mais = api.tipo.dividir(el.$('.mais'), { por: 'palavra' });
    el.cam = api.camera();
    el.P = el.cam.centro(el.$('.c5'));
  },
  quadro(t, el, api) {
    const { prog, ease, lerp, suave, tipo, b } = api;
    const V = el.V;
    Vice.vida(t, V, api);
    // as duas torres giram juntas
    const ry = -30 + 1.6 * (t - api.ref);
    api.set(el.c5, { vars: { '--ry': `${ry.toFixed(3)}deg` } });
    // GTA VI sobe até 7,5× a outra, com mola curta
    const h6 = (api.vertical ? 48 : 67.5) * api.spring(t - b(1), { freq: 0.95, damp: 5.8 });
    api.set(el.c6, { vars: { '--h': `${Math.max(0.3, h6).toFixed(3)}cqmin`, '--ry': `${ry.toFixed(3)}deg` }, style: { visibility: t < b(1) ? 'hidden' : 'visible' } });
    const r6 = ease.forte(prog(t, 1.4, 2.0));
    api.set(el.$('.c6 .torre-rotulo'), { o: suave(prog(t, 1.4, 1.6)), y: 1 * (1 - r6) });
    // texto
    api.set(el.$('.texto'), { o: 1 });
    tipo.focar(t, el.ate, { inicio: b(3.5) });
    tipo.lente(t, el.vezes, { inicio: b(4) });
    tipo.focar(t, el.mais, { inicio: b(5) });
    tipo.brilho(t, el.vezes, { inicio: b(8), dur: 0.7, forca: 0.45 });
    tipo.derivaDestaque(t, el.vezes, { inicio: b(5) });
    // o sol começa a afundar e a luz cai
    const pz = ease.inOutSine(prog(t, b(10), 6.0));
    const S = api.vertical ? 46 : 30;
    const d = 9 * pz * (S / 30);
    api.set(V.sol, { y: d * 0.5625 * api.k, style: { webkitMaskImage: `linear-gradient(180deg, #000 ${50 - (d / S) * 100}%, transparent ${50.5 - (d / S) * 100}%)`, maskImage: `linear-gradient(180deg, #000 ${50 - (d / S) * 100}%, transparent ${50.5 - (d / S) * 100}%)` } });
    // câmera: recua de perto da torre pequena até o plano aberto; peso quando o 7x trava
    const rec = ease.forte(prog(t, api.inicioEntrada(0), 2.0));
    const peso = 0.012 * api.pulsoSemQuique(prog(t, b(4) + 0.3, b(4) + 1.2), 0.3);
    el.cam.pose({ zoom: lerp(1.6, 1, rec) * (1 + peso) * (1 + 0.004 * (t - api.ref)), x: el.P[0] * (1 - rec), y: el.P[1] * (1 - rec) });
  },
});

<script>/* ressalva — "A verdade" (3 s)
   Ideia: a noite cai sobre Vice City e a frase da ressalva acende como um letreiro que liga:
   cada letra nasce quente e esfria, sem piscar.
   Batidas: 0 etiqueta · b(0,5) frase · b(2) nota · b(3) brilho em "nunca" · saída esmaecer. */
Motion.cena('ressalva', {

    ${Vice.cenario({ classe: 'noite', sol: false })}

      <p class="etiqueta">Detalhe</p>
      <h2 class="titulo frase">${c.porFormato({ '16x9': 'A Rockstar <span class="destaque">nunca</span><br>revelou o valor', '9x16': 'A Rockstar<br><span class="destaque">nunca</span> revelou<br>o valor' })}</h2>
      <p class="nota">os números são estimativas de mercado</p>
    </div>`,
  poses: {
    inicio: (el, api) => { api.set([el.$('.frase'), el.$('.nota')], { o: 0 }); },
    meio: (el, api) => { api.set(el.$('.nota'), { o: 0 }); },
  },
  montar(el, api) {

    el.cam = api.camera();
  },
  quadro(t, el, api) {
    const { tipo, b, prog, suave } = api;
    Vice.vida(t, el.V, api, { sol: 0 });
    tipo.focar(t, el.et, { inicio: api.inicioEntrada(0.02) });
    // neon que liga: cada letra nasce quente (brilho alto) e esfria até a cor final
    const ent = tipo.focar(t, el.letras, { inicio: b(0.5), cascata: 0.024, aplicar: false });
    el.letras.forEach((p, i) => {
      const t0 = b(0.5) + 0.024 * i;
      ent[i].bright = 1 + 0.9 * (1 - suave(prog(t, t0 + 0.05, t0 + 0.55)));
    });
    tipo.aplicar(el.letras, ent);
    tipo.focar(t, el.nota, { inicio: b(2) });
    tipo.brilho(t, el.dest, { inicio: b(3), dur: 0.6, forca: 0.45 });
    tipo.derivaDestaque(t, el.letras, { inicio: b(3.5) });
    el.cam.pose({ zoom: 1 + 0.01 * (t - api.ref) });
  },
});

//# sourceURL=cenas/ressalva.js</script>
<script>/* fecho — "A pergunta final" (5 s)
   Ideia: de volta ao pôr do sol da abertura (a rima): a pergunta sobe gigante, o sol afunda no mar,
   o horizonte encolhe até um ponto e apaga.
   Batidas: 0 "vai valer" · b(1) "cada centavo?" pela lente · b(3) brilho · b(7) o sol afunda ·
   4,4 tudo sai e o horizonte vira um ponto · último quadro: o fundo. */
Motion.cena('fecho', {
  render: (c) => `
    ${Vice.cenario()}
    <div class="pilha bloco">
      <p class="titulo l1">Vai valer</p>
      <h2 class="titulo l2"><span class="destaque">${c.porFormato({ '16x9': 'cada centavo?', '9x16': 'cada<br>centavo?' })}</span></h2>
    </div>`,
  poses: {
    inicio: (el, api) => { api.set(el.$('.l2'), { o: 0 }); api.set(el.$('.l1'), { o: 0.4, blur: 0.6 }); },
    meio: (el, api) => { api.set(el.$('.l2'), { o: 0.55, blur: 0.8, s: 1.25 }); },
  },
  montar(el, api) {
    el.V = Vice.pecas(el);
    el.l1 = api.tipo.dividir(el.$('.l1'), { por: 'palavra' });
    el.l2 = api.tipo.dividir(el.$('.l2'), { por: 'letra' });
    el.cam = api.camera();
  },
  quadro(t, el, api) {
    const { prog, ease, lerp, suave, tipo, b } = api;
    const V = el.V;
    // o sol afunda no mar e o céu escurece
    const pz = ease.inOutSine(prog(t, b(7), 4.6));
    Vice.vida(t, V, api, { sol: 1 - pz });
    const S = api.vertical ? 46 : 30;
    const d = 15 * pz * (S / 30);
    const corte = 50 - (d / S) * 100;
    api.set(V.sol, { y: d * 0.5625 * api.k, style: { webkitMaskImage: `linear-gradient(180deg, #000 ${corte}%, transparent ${corte + 0.5}%)`, maskImage: `linear-gradient(180deg, #000 ${corte}%, transparent ${corte + 0.5}%)` } });
    // o mundo apaga; a linha do horizonte encolhe até um ponto e some por último
    const apaga = ease.inCubic(prog(t, 4.2, 4.85));
    api.set([V.ceu, V.mar, ...V.sky, ...V.palmas], { o: 1 - apaga, bright: 1 - 0.45 * pz });
    const enc = ease.inExpo(prog(t, 4.35, 4.85));
    api.set(V.linha, { sx: lerp(1, 0.01, enc), o: 1 - suave(prog(t, 4.8, 4.98)) });
    // a pergunta
    const s1 = tipo.focar(t, el.l1, { inicio: api.inicioEntrada(0.02), aplicar: false });
    const s2 = tipo.lente(t, el.l2, { inicio: b(1), eixo: 'quadro', aplicar: false });
    const x1 = tipo.sair(t, el.l1, { inicio: 4.2, dur: 0.3, aplicar: false });
    const x2 = tipo.sair(t, el.l2, { inicio: 4.25, dur: 0.3, aplicar: false });
    tipo.aplicar(el.l1, s1, x1);
    tipo.aplicar(el.l2, s2, x2);
    tipo.brilho(t, el.l2, { inicio: b(3), dur: 0.8, forca: 0.45 });
    tipo.derivaDestaque(t, el.l2, { inicio: b(3.5) });
    el.cam.pose({ zoom: 1 + 0.009 * (t - api.ref), y: -3 * pz });
  },
});

//# sourceURL=cenas/fecho.js</script>
