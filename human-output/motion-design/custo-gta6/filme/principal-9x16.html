:root {
  --fundo: #12071f;
  --texto: #fff3ea;
  --texto-suave: #d6b4d9;
  --destaque: #ff6a4d;
  --destaque-grad: linear-gradient(100deg, #ff2f92 0%, #ff5a5f 38%, #ff8a3d 70%, #ffc663 100%);
  --luz-1: #b8246f;
  --luz-2: #3a1466;
  --luz-3: #ff7a3d;
  --brilho: #ffffff;
  --linha: color-mix(in srgb, var(--texto) 16%, transparent);

  /* céu de Vice City */
  --ceu-alto: #12071f;
  --ceu-meio: #4a1462;
  --ceu-rosa: #c92a78;
  --ceu-laranja: #ff7b3f;
  --ceu-ouro: #ffc46a;
  --mar: #1a0a2e;
  --silhueta: #0b0414;

  /* a torre de dinheiro */
  --torre-frente: #ff4f7e;
  --torre-lado: #9b1e64;
  --torre-topo: #ffc46a;

  --fonte-titulo: "Anton", ui-sans-serif, system-ui, sans-serif;
  --fonte-texto: "Inter", ui-sans-serif, system-ui, sans-serif;
  --titulo-peso: 400;
  --titulo-tracking: 0.005em;
  --titulo-entrelinha: 0.96;

  --raio: 2cqmin;
  --mockup-moldura: #0c0d0f;
  --mockup-raio: 3.4cqmin;
  --mockup-sombra: #000000;
}

/* ── motor/base.css ── */
/* base.css — o palco, os invólucros do motor e utilitários neutros.
   Nenhuma cor própria: tudo vem de var(--…) da marca da pessoa (marca/tokens.css), com
   recuos neutros só para nada quebrar se um token faltar.

   Tokens que a marca preenche (obrigatórios): --fundo --texto --texto-suave --destaque
   --destaque-grad --luz-1 --luz-2 --luz-3 --fonte-titulo --fonte-texto --titulo-peso
   --titulo-tracking --titulo-entrelinha --raio
   Opcionais: --acao --acao-tinta --linha --vidro --vidro-borda --brilho --mockup-moldura
   --mockup-raio --mockup-sombra

   Unidades: tipografia em cqmin (o mesmo tamanho em px no 16:9 e no 9:16), posições em cqw/cqh.
   Para recompor o 9:16, escreva regras em [data-formato="9x16"] .cena-<id> … */

html, body { margin: 0; padding: 0; }
body { background: var(--fundo, #0b0b0c); overflow: hidden; }

#palco {
  position: relative;
  overflow: hidden;
  container-type: size;
  background: var(--fundo, #0b0b0c);
  color: var(--texto, #f2f2f2);
  font-family: var(--fonte-texto, system-ui, sans-serif);
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
  font-kerning: normal;
  transform-origin: 0 0;
}
#palco *, #palco *::before, #palco *::after {
  box-sizing: border-box;
  transition: none !important;
  caret-color: transparent;
}

/* ─── invólucros do motor ─── */
.m-cena {
  position: absolute;
  inset: 0;
  display: none;
  overflow: hidden;
  background: var(--fundo-cena, var(--fundo, #0b0b0c));
  isolation: isolate;
}
.m-cena.m-ativa, #palco.m-medindo .m-cena { display: block; }
.m-camera, .m-conteudo {
  position: absolute;
  inset: 0;
  transform-origin: 50% 50%;
}
.m-sobre {
  position: absolute;
  inset: 0;
  z-index: 1000;
  pointer-events: none;
}
/* Fundo puro (para blend na edição): a cor exata em todos os quadros, sem luz, grão nem vinheta. */
.m-cena.m-fundo-puro { background: var(--fundo, #000); }
.m-cena.m-fundo-puro .luz, .m-cena.m-fundo-puro .vinheta { display: none !important; }

/* ─── utilitários de composição ─── */
.camada { position: absolute; inset: 0; }
/* Plano cheio (foto, véu, degradê, textura de fundo): nasce com sobra de 6 % em cada borda.
   A câmera viva passa por escala < 1 antes do quadro aprovado; sem a sobra, a borda aparece. */
.plano { position: absolute; inset: calc(var(--sangria, 6%) * -1); }
.plano > .m-foto, .plano > .m-video, .plano > img { position: absolute; inset: 0; width: 100%; height: 100%; }
/* Véu de contraste por cima da foto (também sangrado). A cena escolhe o degradê. */
.veu { position: absolute; inset: calc(var(--sangria, 6%) * -1); pointer-events: none; }
.pilha {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.titulo {
  margin: 0;
  font-family: var(--fonte-titulo, var(--fonte-texto, system-ui, sans-serif));
  font-weight: var(--titulo-peso, 400);
  letter-spacing: var(--titulo-tracking, -0.02em);
  line-height: var(--titulo-entrelinha, 1.02);
  color: var(--texto, #f2f2f2);
}
.apoio {
  margin: 0;
  font-family: var(--fonte-texto, system-ui, sans-serif);
  color: var(--texto-suave, #a6a6a6);
}
.destaque {
  background-image: var(--destaque-grad, linear-gradient(90deg, var(--destaque, #fff), var(--destaque, #fff)));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
  padding-block: 0.1em;
  margin-block: -0.1em;
}
.m-destaque-dividido { padding-block: 0; margin-block: 0; }

/* Luz de fundo sem borda: duas fontes macias que a cena pode mover/respirar. Cada cena pode pôr as
   fontes em outro lugar (--luz-a-x/y, --luz-b-x/y, em % da caixa da luz, que sangra 25 %): variar a
   luz entre as cenas é o que impede o filme de parecer a mesma vinheta repetida. */
.luz {
  position: absolute;
  inset: -25%;
  pointer-events: none;
  background:
    radial-gradient(closest-side at var(--luz-a-x, 32%) var(--luz-a-y, 40%),
      color-mix(in srgb, var(--luz-1, #444) 55%, transparent) 0%,
      color-mix(in srgb, var(--luz-1, #444) 41%, transparent) 18%,
      color-mix(in srgb, var(--luz-1, #444) 25%, transparent) 36%,
      color-mix(in srgb, var(--luz-1, #444) 12%, transparent) 54%,
      color-mix(in srgb, var(--luz-1, #444) 4%, transparent) 72%,
      color-mix(in srgb, var(--luz-1, #444) 0.6%, transparent) 88%,
      transparent 100%),
    radial-gradient(closest-side at var(--luz-b-x, 70%) var(--luz-b-y, 64%),
      color-mix(in srgb, var(--luz-2, #333) 45%, transparent) 0%,
      color-mix(in srgb, var(--luz-2, #333) 33%, transparent) 18%,
      color-mix(in srgb, var(--luz-2, #333) 20%, transparent) 36%,
      color-mix(in srgb, var(--luz-2, #333) 9%, transparent) 54%,
      color-mix(in srgb, var(--luz-2, #333) 3%, transparent) 72%,
      color-mix(in srgb, var(--luz-2, #333) 0.4%, transparent) 88%,
      transparent 100%);
}

/* ─── texto dividido ─── */
.m-palavra { white-space: nowrap; }
.m-letra, .m-bloco {
  display: inline-block;
  white-space: pre;
  padding-block: 0.1em;
  margin-block: -0.1em;
  transform-origin: 50% 62%;
}
.m-linha { display: block; }
.m-linha-in { display: inline-block; transform-origin: 50% 60%; }
.m-linha.m-mascara { overflow: clip; padding-block: 0.16em; margin-block: -0.16em; }

/* Brilho que atravessa a palavra: cópia do glifo somada (plus-lighter), vista por uma faixa. */
.m-brilho { position: relative; }
.m-brilho::after {
  content: attr(data-m-ch);
  position: absolute;
  inset: -0.3em -0.2em;
  padding: 0.4em 0.2em 0.3em;
  white-space: pre;
  pointer-events: none;
  background: none;
  color: var(--m-brilho-tinta, rgba(255, 255, 255, 0.5));
  -webkit-text-fill-color: var(--m-brilho-tinta, rgba(255, 255, 255, 0.5));
  mix-blend-mode: plus-lighter;
  --m-faixa: linear-gradient(var(--m-brilho-angulo, 104deg),
    transparent calc(50% - var(--m-brilho-meia, 1cqw)),
    rgba(0, 0, 0, 0.1) calc(50% - var(--m-brilho-meia, 1cqw) * 0.86),
    rgba(0, 0, 0, 0.5) calc(50% - var(--m-brilho-meia, 1cqw) * 0.72),
    rgba(0, 0, 0, 0.9) calc(50% - var(--m-brilho-meia, 1cqw) * 0.58),
    #000 calc(50% - var(--m-brilho-nucleo, 0.75cqw)),
    #000 calc(50% + var(--m-brilho-nucleo, 0.75cqw)),
    rgba(0, 0, 0, 0.9) calc(50% + var(--m-brilho-meia, 1cqw) * 0.58),
    rgba(0, 0, 0, 0.5) calc(50% + var(--m-brilho-meia, 1cqw) * 0.72),
    rgba(0, 0, 0, 0.1) calc(50% + var(--m-brilho-meia, 1cqw) * 0.86),
    transparent calc(50% + var(--m-brilho-meia, 1cqw)));
  -webkit-mask-image: var(--m-faixa);
  mask-image: var(--m-faixa);
  -webkit-mask-size: var(--m-brilho-caixa, 8cqw) 100%;
  mask-size: var(--m-brilho-caixa, 8cqw) 100%;
  -webkit-mask-repeat: no-repeat;
  mask-repeat: no-repeat;
  -webkit-mask-position: var(--m-brilho-x, -400cqw) 0;
  mask-position: var(--m-brilho-x, -400cqw) 0;
}

.m-cursor {
  display: inline-block;
  width: 0.08em;
  height: 1em;
  margin-left: 0.04em;
  vertical-align: -0.12em;
  background: currentColor;
}
.numero { font-variant-numeric: tabular-nums; }

/* ─── mídia ─── */
.m-foto { display: block; width: 100%; height: 100%; object-fit: cover; user-select: none; }
.m-svg { display: block; width: 100%; height: auto; overflow: visible; }
/* c.svg(nome, { viewBox }) ou { so: '.simbolo' }: só o recorte aparece, nada vaza da caixa */
.m-svg.m-recorte { overflow: hidden; }
.m-faltando {
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
  min-height: 4cqmin;
  outline: 0.3cqmin dashed color-mix(in srgb, var(--texto, #fff) 40%, transparent);
  color: var(--texto-suave, #999);
  font: 1.6cqmin/1.2 system-ui, sans-serif;
}

/* ─── mockups (aparelhos em CSS; a tela é qualquer HTML) ─── */
.m-mockup {
  position: relative;
  --m-moldura: var(--mockup-moldura, #0d0e10);
  --m-raio: var(--mockup-raio, 3.4cqmin);
  --m-sombra-cor: var(--mockup-sombra, #000);
  transform-origin: 50% 50%;
}
.m-mockup-corpo {
  position: relative;
  width: 100%;
  height: 100%;
  background: var(--m-moldura);
  border-radius: var(--m-raio);
  box-shadow:
    var(--m-sombra-x, 0cqw) var(--m-sombra-y, 1.2cqw) 4.5cqw color-mix(in srgb, var(--m-sombra-cor) 42%, transparent),
    var(--m-sombra-x, 0cqw) calc(var(--m-sombra-y, 1.2cqw) * 0.3) 1.2cqw color-mix(in srgb, var(--m-sombra-cor) 30%, transparent),
    inset 0 0 0 0.12cqmin color-mix(in srgb, #fff 9%, transparent);
}
.m-mockup-tela {
  position: absolute;
  overflow: hidden;
  background: var(--fundo, #000);
}
.m-mockup-reflexo {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background: linear-gradient(115deg,
    transparent calc(var(--m-reflexo, 30%) - 22%),
    color-mix(in srgb, #fff 3%, transparent) calc(var(--m-reflexo, 30%) - 10%),
    color-mix(in srgb, #fff 8%, transparent) var(--m-reflexo, 30%),
    color-mix(in srgb, #fff 3%, transparent) calc(var(--m-reflexo, 30%) + 10%),
    transparent calc(var(--m-reflexo, 30%) + 22%));
  mix-blend-mode: plus-lighter;
}
.m-celular { width: 30cqmin; aspect-ratio: 9 / 19.5; }
.m-celular .m-mockup-tela { inset: 1.1cqmin; border-radius: calc(var(--m-raio) - 1cqmin); }
.m-celular .m-mockup-ilha {
  position: absolute;
  top: 2.2cqmin;
  left: 50%;
  width: 26%;
  height: 2.6%;
  translate: -50% 0;
  border-radius: 9cqmin;
  background: var(--m-moldura);
}
.m-tablet { width: 56cqmin; aspect-ratio: 3 / 4; }
.m-tablet .m-mockup-tela { inset: 2cqmin; border-radius: calc(var(--m-raio) - 1.6cqmin); }
.m-notebook { width: 92cqmin; }
.m-notebook .m-mockup-corpo { aspect-ratio: 16 / 10.2; height: auto; border-radius: 2.2cqmin 2.2cqmin 0.6cqmin 0.6cqmin; }
.m-notebook .m-mockup-tela { inset: 2.2cqmin 2.2cqmin 3.2cqmin; border-radius: 0.6cqmin; }
.m-notebook .m-mockup-base {
  position: relative;
  width: 112%;
  margin-left: -6%;
  height: 2.4cqmin;
  border-radius: 0 0 2.4cqmin 2.4cqmin;
  background: linear-gradient(180deg, color-mix(in srgb, var(--m-moldura) 80%, #fff) 0%, var(--m-moldura) 70%);
}
.m-navegador, .m-janela { width: 100cqmin; aspect-ratio: 16 / 10.4; }
.m-navegador .m-mockup-corpo, .m-janela .m-mockup-corpo { border-radius: 1.6cqmin; overflow: hidden; }
.m-navegador .m-mockup-barra, .m-janela .m-mockup-barra {
  position: absolute;
  inset: 0 0 auto;
  height: 4.2cqmin;
  display: flex;
  align-items: center;
  gap: 0.9cqmin;
  padding-left: 1.8cqmin;
}
.m-navegador .m-mockup-barra i {
  width: 1.1cqmin;
  height: 1.1cqmin;
  border-radius: 50%;
  background: color-mix(in srgb, #fff 18%, transparent);
}
.m-navegador .m-mockup-tela, .m-janela .m-mockup-tela { inset: 4.2cqmin 0 0; }
.m-cartao { width: 40cqmin; aspect-ratio: 4 / 5; }
.m-cartao .m-mockup-tela { inset: 0; border-radius: var(--m-raio); }

/* ─── conferência de contraste (o storyboard esconde os textos para medir o fundo) ─── */
.m-sem-texto [data-m-medido] { visibility: hidden !important; }

/* ─── área segura (o player e a inspeção desenham por cima) ─── */
.m-seguro {
  position: absolute;
  z-index: 2000;
  pointer-events: none;
  outline: 2px dashed rgba(255, 64, 64, 0.85);
  outline-offset: -1px;
}

/* ─── erros na prévia ─── */
#m-erros {
  position: fixed;
  left: 12px;
  top: 12px;
  z-index: 9999;
  max-width: min(560px, calc(100vw - 24px));
  display: flex;
  flex-direction: column;
  gap: 6px;
  font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace;
}
#m-erros:empty { display: none; }
#m-erros > div { padding: 8px 10px; border-radius: 8px; background: #b3261e; color: #fff; }
html.m-captura #m-erros { display: none; }

/* nivel.css — materiais de "nível de filme" (ver motor/nivel.js). Só tokens da marca, com recuos
   neutros. Tokens opcionais que a marca pode preencher: --vidro --vidro-reflexo --vidro-borda
   --cartao-forte --cartao-heroi --raio.

   .m-vidro        vidro escuro fosco sobre luz: deixa passar a luz de trás (backdrop), tem a sua
                   própria luz atrás (duas manchas: --x1 --y1 --c1 e --x2 --y2 --c2, intensidade
                   --mo) e um fio de borda claro em cima e na ponta (--vidro-borda, opacidade --borda).
                   Uma família só: todos os cards iguais, muda só a cor da luz de cada um.
   .m-vidro-forte  o card de destaque: a cor da marca como superfície (sem vidro).
   .m-vidro-heroi  o protagonista: luz da marca de dentro para fora. */
.m-vidro {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  border-radius: var(--raio, 1.6cqw);
  background:
    var(--vidro-reflexo, linear-gradient(158deg, color-mix(in srgb, #fff 9%, transparent) 0%, color-mix(in srgb, #fff 2%, transparent) 28%, transparent 46%)),
    var(--vidro, linear-gradient(color-mix(in srgb, #0a0c10 62%, transparent), color-mix(in srgb, #050608 74%, transparent)));
  -webkit-backdrop-filter: blur(2.2cqw) saturate(1.35);
  backdrop-filter: blur(2.2cqw) saturate(1.35);
}
.m-vidro::before {
  content: '';
  position: absolute;
  inset: -15%;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(circle at var(--x1, 50%) var(--y1, 100%), var(--c1, transparent) 0%, transparent 46%),
    radial-gradient(circle at var(--x2, 50%) var(--y2, 50%), var(--c2, transparent) 0%, transparent 40%);
  filter: blur(2cqw) saturate(0.7);
  opacity: var(--mo, 0.7);
}
.m-vidro::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  pointer-events: none;
  background: var(--vidro-borda, linear-gradient(145deg, color-mix(in srgb, #fff 36%, transparent), color-mix(in srgb, #fff 6%, transparent) 36%, color-mix(in srgb, #fff 4%, transparent) 64%, color-mix(in srgb, #fff 24%, transparent)));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  opacity: var(--borda, 1);
}
.m-vidro-forte {
  background: var(--cartao-forte, radial-gradient(ellipse 95% 85% at 85% 0%, var(--destaque, #ccc) 0%, color-mix(in srgb, var(--destaque, #ccc) 55%, var(--fundo, #000)) 40%, var(--fundo, #000) 100%));
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
}
.m-vidro-forte::before { display: none; }
.m-vidro-heroi {
  background: var(--cartao-heroi, radial-gradient(ellipse 85% 70% at 50% 38%, var(--luz-1, #333) 0%, color-mix(in srgb, var(--luz-1, #333) 50%, var(--fundo, #000)) 40%, var(--fundo, #000) 100%));
}

/* player.css — só aparece fora do modo captura. Paleta neutra própria (não é a marca). */
body.m-com-player {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  background: #111214;
  padding-top: 12px;
  box-sizing: border-box;
}
#m-moldura { position: relative; overflow: hidden; border-radius: 10px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45); }
#m-moldura #palco { position: absolute; left: 0; top: 0; }
#m-player {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: 12px;
  z-index: 50;
  padding: 10px 12px 8px;
  border-radius: 12px;
  background: rgba(24, 25, 28, 0.94);
  color: #e9eaee;
  font: 12px/1.3 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-variant-numeric: tabular-nums;
  box-shadow: 0 6px 30px rgba(0, 0, 0, 0.4);
  -webkit-font-smoothing: antialiased;
}
#m-player .m-regua { position: relative; height: 34px; margin-bottom: 8px; }
#m-player .m-cenas { position: absolute; inset: 0 0 10px; }
#m-player .m-cena-faixa {
  position: absolute;
  top: 0;
  bottom: 0;
  border-left: 1px solid rgba(255, 255, 255, 0.22);
  background: rgba(255, 255, 255, 0.05);
  overflow: hidden;
}
#m-player .m-cena-faixa:nth-child(even) { background: rgba(255, 255, 255, 0.08); }
#m-player .m-cena-faixa span { display: block; padding: 5px 6px; white-space: nowrap; color: #b9bcc4; font-size: 11px; }
#m-player .m-batidas { position: absolute; left: 0; right: 0; bottom: 4px; height: 6px; }
#m-player .m-batidas i { position: absolute; bottom: 0; width: 1px; height: 6px; background: rgba(255, 255, 255, 0.25); }
#m-player input[type='range'] { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
#m-player .m-cabeca { position: absolute; top: -2px; bottom: -2px; width: 2px; margin-left: -1px; background: #fff; pointer-events: none; }
#m-player .m-controles { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
#m-player button, #m-player select {
  height: 28px;
  padding: 0 10px;
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 999px;
  background: transparent;
  color: inherit;
  font: inherit;
  cursor: pointer;
}
#m-player button:hover { background: rgba(255, 255, 255, 0.08); }
#m-player button.m-ligado { background: #e9eaee; color: #111214; }
#m-player .m-tocar { min-width: 72px; }
#m-player .m-tempo { margin-left: 8px; color: #fff; }
#m-player .m-cena-atual { color: #9a9ea8; }
#m-player .m-espaco { flex: 1; }

/* ── cenas/_comum.css ── */
/* _comum.css — Vice City ao pôr do sol + a torre 3D de dinheiro. O horizonte fica em --hz (da altura). */
.vice { position: absolute; inset: 0; --hz: 68%; }
.vice .ceu {
  background: linear-gradient(180deg,
    var(--ceu-alto) 0%,
    color-mix(in srgb, var(--ceu-alto) 55%, var(--ceu-meio)) 22%,
    var(--ceu-meio) 42%,
    color-mix(in srgb, var(--ceu-meio) 40%, var(--ceu-rosa)) 54%,
    var(--ceu-rosa) 61%,
    var(--ceu-laranja) 66%,
    var(--ceu-ouro) 68.5%,
    var(--ceu-laranja) 70%,
    var(--mar) 78%,
    var(--silhueta) 100%);
}
/* o sol: luz sem borda, metade abaixo da linha do mar */
.vice .sol-brilho {
  position: absolute; left: 50%; top: var(--hz); width: 120cqw; height: 80cqh;
  translate: -50% -50%;
  background: radial-gradient(closest-side,
    color-mix(in srgb, var(--ceu-ouro) 55%, transparent) 0%,
    color-mix(in srgb, var(--ceu-laranja) 32%, transparent) 22%,
    color-mix(in srgb, var(--ceu-rosa) 16%, transparent) 46%,
    color-mix(in srgb, var(--ceu-rosa) 5%, transparent) 70%,
    transparent 100%);
}
.vice .sol {
  position: absolute; left: 50%; top: var(--hz); width: 30cqmin; height: 30cqmin;
  translate: -50% -50%; border-radius: 50%;
  background: radial-gradient(closest-side, #fff6d6 0%, var(--ceu-ouro) 45%, color-mix(in srgb, var(--ceu-laranja) 80%, transparent) 78%, color-mix(in srgb, var(--ceu-laranja) 0%, transparent) 100%);
  filter: blur(0.25cqmin);
  -webkit-mask: linear-gradient(180deg, #000 50%, transparent 50.5%);
  mask: linear-gradient(180deg, #000 50%, transparent 50.5%);
}
.vice .skyline { position: absolute; left: -6%; right: -6%; bottom: calc(100% - var(--hz)); }
.vice .skyline svg { display: block; width: 100%; height: 100%; }
.vice .skyline-longe { height: 9cqh; opacity: 0.55; }
.vice .skyline-longe path { fill: color-mix(in srgb, var(--ceu-meio) 70%, var(--silhueta)); }
.vice .skyline-perto { height: 6.5cqh; left: 8%; right: 52%; }
.vice .skyline-perto path { fill: var(--silhueta); }
.vice .mar { position: absolute; left: -6%; right: -6%; top: var(--hz); bottom: -6%; overflow: hidden;
  background: linear-gradient(180deg, color-mix(in srgb, var(--ceu-laranja) 45%, var(--mar)) 0%, var(--mar) 30%, var(--silhueta) 100%); }
.vice .reflexo { position: absolute; left: 50%; top: 0; width: 22cqmin; height: 70%; translate: -50% 0;
  background: linear-gradient(180deg, color-mix(in srgb, var(--ceu-ouro) 75%, transparent), color-mix(in srgb, var(--ceu-laranja) 30%, transparent) 40%, transparent);
  filter: blur(1.6cqmin); }
.vice .ondas { position: absolute; inset: 0;
  background: repeating-linear-gradient(180deg, transparent 0 0.9cqh, color-mix(in srgb, var(--silhueta) 55%, transparent) 0.9cqh 1.25cqh);
  -webkit-mask: linear-gradient(180deg, transparent, #000 12%); mask: linear-gradient(180deg, transparent, #000 12%); }
/* o fio condutor: a linha de luz do horizonte */
.vice .horizonte-luz { position: absolute; left: 0; right: 0; top: var(--hz); height: 0.32cqmin; translate: 0 -50%;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--ceu-ouro) 70%, transparent) 25%, #fff6dc 50%, color-mix(in srgb, var(--ceu-ouro) 70%, transparent) 75%, transparent);
  filter: blur(0.08cqmin); transform-origin: 50% 50%; }
.vice .palmas { position: absolute; bottom: -4cqh; height: 92cqh; width: 40cqw; display: flex; align-items: flex-end; }
.vice .palmas-esq { left: -12cqw; }
.vice .palmas-dir { right: -12cqw; flex-direction: row-reverse; }
.vice .palma-svg { height: 100%; width: auto; flex: none; overflow: visible; transform-origin: 50% 100%; }
.vice .palma-svg + .palma-svg { height: 72%; margin-left: -12cqw; margin-right: -12cqw; }
.vice .palma-svg path { fill: var(--silhueta); }
.vice .palma-svg path.nervura { fill: none; stroke: var(--silhueta); stroke-width: 7; stroke-linecap: round; }
.vice .palma-svg path.foliolo { fill: none; stroke: var(--silhueta); stroke-width: 5; stroke-linecap: round; }
.vice .palma-svg path.aneis { fill: none; stroke: color-mix(in srgb, var(--ceu-rosa) 25%, transparent); stroke-width: 1.4; }

/* ─── a torre 3D ─── */
.palco3d { position: absolute; inset: 0; perspective: 190cqmin; perspective-origin: 50% 40%; transform-style: preserve-3d; }
.torre {
  --w: 18cqmin; --d: 18cqmin; --h: 40cqmin; --ry: -32deg; --rx: 0deg;
  position: absolute; left: 50%; bottom: calc(100% - 68%);
  width: var(--w); height: var(--h); margin-left: calc(var(--w) / -2);
  transform-style: preserve-3d; transform-origin: 50% 100%;
  transform: rotateX(var(--rx)) rotateY(var(--ry));

<script>/* motion.js — o núcleo do motor no navegador.

   1. Cada quadro é função pura de t: `quadro(t, el, api)` define toda propriedade animada em toda

   3. Transição é do motor: ele é dono dos invólucros `.m-cena` e `.m-camera`; a cena mexe só do
      `.m-conteudo` para dentro.

      relógio virtual na captura.

   MOTION_MIDIA, MOTION_SVG e MOTION_IMAGENS antes de carregar este arquivo. */

        if (p.bright !== undefined && Math.abs(p.bright - 1) > 1e-4) f.push(`brightness(${n4(p.bright)})`);

        if (p.contraste !== undefined && Math.abs(p.contraste - 1) > 1e-4) f.push(`contrast(${n4(p.contraste)})`);
        if (p.filter) f.push(p.filter);
        el.style.filter = f.length ? f.join(' ') : el.__mFiltroFixo ? 'blur(0px)' : 'none';
      }
      if (p.ls !== undefined) el.style.letterSpacing = `${n4(p.ls)}em`;
      if (p.clip !== undefined) el.style.clipPath = p.clip;
      if (p.mask !== undefined) {
        el.style.webkitMaskImage = p.mask;
        el.style.maskImage = p.mask;
      }
      if (p.mix !== undefined) el.style.mixBlendMode = p.mix;
      if (p.style) Object.assign(el.style, p.style);
      if (p.vars) for (const k in p.vars) el.style.setProperty(k, String(p.vars[k]));

    return set;
  }

  /* ─── caixas em cqw, a partir do centro do quadro ─── */
  function caixaLayout(el, palco, larguraPalco) {
    // Sem transformações: soma offsets até o palco (puro: não depende do quadro anterior).
    const u = larguraPalco / 100;
    if (!(el instanceof HTMLElement)) return caixaTela(el, palco);
    let x = 0, y = 0, n = el;
    while (n && n !== palco) {
      x += n.offsetLeft || 0;
      y += n.offsetTop || 0;
      const pai = n.offsetParent;
      if (!pai) break;
      n = pai;
    }
    const W = palco.offsetWidth, H = palco.offsetHeight;
    const l = el.offsetWidth / u, a = el.offsetHeight / u;
    const xx = x / u - 50, yy = y / u - (H / W) * 50;
    return { x: xx, y: yy, l, a, cx: xx + l / 2, cy: yy + a / 2 };
  }
  function caixaTela(el, palco) {
    const P = palco.getBoundingClientRect();
    const r = el.getBoundingClientRect();
    const u = P.width / 100;
    const xx = (r.left - P.left) / u - 50, yy = (r.top - P.top) / u - (P.height / P.width) * 50;

  /* ─── o objeto global ─── */
  const Motion = {
    versao: '1.0.0',
    tempo: TT,
    FORMATOS,
    ESTILO_PADRAO,
    captura: CAPTURA,
    cenas: {},
    transicoes: {},
    extensoes: [],
    extensoesC: [],
    cenaR: [],
    linha: null,
    palco: null,
    pronto: false,
    erro,
    semear,
    /** Registra uma cena: { render(c), poses, montar(el, api), quadro(t, el, api) }. */
    cena(id, def) {
      if (this.cenas[id]) erro(id, 'registro', null, `a cena "${id}" foi registrada duas vezes`);
      this.cenas[id] = def || {};
    },
    /** Registra uma transição: { modo, dur, antes, depois, preparar(A,B,op,api), aplicar(e,A,B,op,api) }. */
    transicao(nome, def) {
      this.transicoes[nome] = def;
    },
    /** Acrescenta coisas ao api de cada cena: fn(api, ctx). */
    estender(fn) {
      this.extensoes.push(fn);
    },
    /** Acrescenta coisas ao `c` do render: fn(c, ctx). */
    estenderC(fn) {
      this.extensoesC.push(fn);
    },
    caixaTela: (el) => caixaTela(el, Motion.palco),
  };
  window.Motion = Motion;

  /* ─── camadas do motor (véu, luz) por cima de todas as cenas ─── */
  const camadas = {};
  function camada(nome) {
    if (!camadas[nome]) {
      const d = document.createElement('div');
      d.className = `m-sobre m-sobre-${nome}`;
      d.style.display = 'none';
      Motion.palco.appendChild(d);
      camadas[nome] = d;
    }
    const d = camadas[nome];
    d.__usada = true;
    return d;
  }
  function zerarCamadas() {
    for (const k in camadas) {
      const d = camadas[k];
      if (d.__usada || d.style.display !== 'none') d.style.cssText = 'display:none';
      d.__usada = false;
    }
  }
  Motion.camada = camada;

  /* ─── invólucros ─── */
  function zerarInvolucros(R) {
    R.secao.style.cssText = `z-index:${10 + R.indice}`;
    R.camera.style.cssText = '';
  }
  /** Posição da câmera do motor (transições): p → s·p + (x, y), origem no centro do quadro. */
  function posarCamera(R, { s = 1, x = 0, y = 0, r = 0 } = {}) {
    const tf = [];
    if (x || y) tf.push(`translate(${n4(x)}cqw, ${n4(y)}cqw)`);
    if (r) tf.push(`rotate(${n4(r)}deg)`);
    if (Math.abs(s - 1) > 1e-7) tf.push(`scale(${n6(s)})`);
    R.camera.style.transform = tf.join(' ');
  }
  /* estilo da cena inteira (o .m-cena, com o fundo) e, com `brilho` / `oConteudo`, só do conteúdo
     (o .m-camera: o fundo da cena não clareia nem some junto). */
  function estilizarCena(R, { o, blur, bright, clip, mask, z, mix, filtro, x, y, brilho, oConteudo } = {}) {
    const st = R.secao.style;
    if (brilho !== undefined || oConteudo !== undefined) {
      const cs = R.camera.style;
      if (brilho !== undefined && Math.abs(brilho - 1) > 1e-4) {
        const atual = cs.filter && cs.filter !== 'none' ? cs.filter.replace(/brightness\([^)]*\)/g, '').trim() : '';
        cs.filter = `${atual} brightness(${n4(brilho)})`.trim();
      }
      if (oConteudo !== undefined) cs.opacity = n4(clamp(oConteudo));
    }
    if (o !== undefined) st.opacity = n4(clamp(o));
    // mover a cena inteira (com o fundo): empurrões e chicotes
    if (x || y) st.transform = `translate(${n4(x || 0)}cqw, ${n4(y || 0)}cqw)`;
    const f = [];
    if (blur) {
      const px = Math.round(blur * R.api.pxPorCqw * 20) / 20;
      if (px >= 0.1) f.push(`blur(${px}px)`);
    }
    if (bright !== undefined && Math.abs(bright - 1) > 1e-4) f.push(`brightness(${n4(bright)})`);
    if (filtro) f.push(filtro);
    if (f.length) st.filter = f.join(' ');
    if (clip !== undefined) st.clipPath = clip;
    if (mask !== undefined) {
      st.webkitMaskImage = mask;
      st.maskImage = mask;
    }

  }

  /* ─── montagem ─── */
  function criarC(R, ctx) {
    const f = ctx.formato;
    const c = {
      formato: ctx.nomeFormato,
      vertical: ctx.vertical,
      largura: f.largura,
      altura: f.altura,
      k: ctx.k,
      cena: R.id,
      esc: (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'),
      porFormato: (obj) => (obj && (obj[ctx.nomeFormato] ?? obj.padrao)),
    };
    for (const fn of Motion.extensoesC) fn(c, ctx, R);
    return c;
  }

  function criarApi(R, ctx) {
    const L = ctx.linha;
    const f = ctx.formato;
    const pxPorCqw = f.largura / 100;
    const H = (f.altura / f.largura) * 100;
    const estilo = Object.assign({}, ESTILO_PADRAO, L.estilo || {});
    const batida = 60 / (L.bpm || 120);
    const umQuadro = 1 / (L.fps || 60);
    const quadros = R.quadros || [];
    // o quadro aprovado: o marcado com "aprovado": true, senão o último quadro-chave
    const qAprovado = quadros.find((q) => q.aprovado) || quadros[quadros.length - 1];
    const ref = qAprovado ? qAprovado.t : Math.max(0, R.dur - umQuadro);
    const api = Object.assign({}, TT);
    Object.assign(api, {
      bpm: L.bpm || 120,
      batida,
      b: (n) => n * batida,
      fps: L.fps || 60,
      umQuadro,
      dur: R.dur,
      ultimo: Math.max(0, R.dur - umQuadro),
      ref,
      formato: ctx.nomeFormato,
      vertical: ctx.vertical,
      largura: f.largura,
      altura: f.altura,
      H,
      k: ctx.k,
      pxPorCqw,
      seguro: { x: f.seguro.x * 100, topo: f.seguro.topo * H, base: f.seguro.base * H },
      porFormato: (obj) => (obj && (obj[ctx.nomeFormato] ?? obj.padrao)),
      estilo,
      set: criarSet(pxPorCqw),
      base: (el, transform) => {
        if (el) el.__mBase = transform || '';
      },
      $: (s) => R.conteudo.querySelector(s),
      $$: (s) => [...R.conteudo.querySelectorAll(s)],
      caixa: (el) => caixaLayout(typeof el === 'string' ? R.conteudo.querySelector(el) : el, ctx.palco, f.largura),
      caixaNaTela: (el) => caixaTela(typeof el === 'string' ? R.conteudo.querySelector(el) : el, ctx.palco),
      cena: { id: R.id, indice: R.indice, inicio: R.inicio, dur: R.dur, titulo: R.titulo },
      entrada: R.entrada || null,
      saida: R.saida || null,
      cortesInternos: R.cortesInternos || [],
      anterior: { ponte: (nome) => (R.vizinhaAntes && R.vizinhaAntes.pontes.fim[nome]) || null },
      proxima: { ponte: (nome) => (R.vizinhaDepois && R.vizinhaDepois.pontes.inicio[nome]) || null },
      /** Push-in que nunca para e passa por 1,0 no quadro aprovado. */
      viva: (t, { v = estilo.camera, ref: r = ref } = {}) => 1 + v * (t - r),
      /** Quando a entrada começa: se a cena entra por corte (corte, corte-no-eixo, avançar-desfocar,
          na-cena), a entrada começa ANTES do corte (padrão −0,12 s), para o corte cair com a frase
          já entrando e nunca num quadro vazio; senão, `padrao`. */
      inicioEntrada: (padrao = 0.1, antesDoCorte = -0.12) =>
        (R.entrada && R.entrada.modo === 'encadeada' && R.entrada.tipo !== 'flash' ? antesDoCorte : padrao),
      /** Vida no hold: onda que nasce sem degrau e passa por zero no quadro aprovado (ref). */
      vida: (t, o = {}) => TT.vida(t, Object.assign({ ref }, o)),
      /** O BPM na tela: a batida mais recente desde `de` (a cada `cada` batidas). Devolve { k, v }:
          k = o número da batida (−1 antes de `de`), v = pulso sem quique 0 → 1 → 0, pico em `ataque` s.
          Ex.: no hold, um item por batida dá um pulso: s *= 1 + 0.03 * (nb.k % n === i ? nb.v : 0). */
      naBatida: (t, { de = 0, cada = 1, ataque = 0.1 } = {}) => {
        if (t < de) return { k: -1, v: 0 };

        return { k, v: TT.pulsoSemQuique(t - de - k * per, ataque) };
      },

      tremor: (t, t0, { forca = 0.4, freq = 9, amortecimento = 6, semente: sm = 1 } = {}) => {
        const tau = t - t0;

        const env = Math.exp(-amortecimento * tau) * forca;
        return {
          x: env * Math.sin(2 * Math.PI * freq * tau + TT.rand(sm) * 6.28),
          y: env * Math.sin(2 * Math.PI * freq * 1.13 * tau + TT.rand(sm + 1) * 6.28),
          giro: env * 0.6 * Math.sin(2 * Math.PI * freq * 0.87 * tau + TT.rand(sm + 2) * 6.28),
        };
      },
      camada: (nome) => camada(`${R.id}-${nome}`),
    });
    for (const fn of Motion.extensoes) {
      try {
        fn(api, Object.assign({ R }, ctx));
      } catch (e) {

      }
    }
    return api;
  }

  function lado(R) {
    if (!R) return null;

      id: R.id,
      R,
      cena: R.secao,
      camera: R.camera,
      conteudo: R.conteudo,
      get t() {
        return R.tLocal;
      },
      get ativa() {
        return R.ativa;
      },
      dur: R.dur,
      $: (s) => R.conteudo.querySelector(s),
      pontes: R.pontes,
      api: R.api,
      /** Caixa de um elemento medida no começo ('inicio') ou no fim ('fim') da cena. */
      medida: (sel, quando = 'fim') => (R.medidas[`${quando}|${sel}`] || null),
      posar: (p) => posarCamera(R, p),
      estilo: (p) => estilizarCena(R, p),

  function medirPontes(R, palco) {

    R.tLocal = tl;

        R.def.quadro(tl, R.el, R.api);
      } catch (e) {

      }

    // (uma cena que volta de display:none recria as animações, então busca a cada quadro)

  function aplicarTransicao(X, t) {
    const def = Motion.transicoes[X.tipo];
    if (!def || !def.aplicar) return;
    if (t < X.inicio - EPS || t > X.fim + EPS) return;
    const A = Motion.cenaPorId[X.de];
    const B = X.para ? Motion.cenaPorId[X.para] : null;
    const e = { t, tipo: X.tipo };
    if (X.modo === 'sobreposta') {
      e.p = prog(t, X.inicio, X.fim);
      e.lado = 'ambos';
    } else {
      if (t < X.corte - EPS) {

        e.lado = 'A';

      } else {
        if (!B || !B.ativa) return;
        if (t >= X.fim - EPS && X.depois > 0) return;

        e.pB = X.depois > 0 ? prog(t, X.corte, X.corte + X.depois) : 1;

  /* ─── camada de plano cheio sem sobra ───
     A câmera viva passa por escala < 1 antes do quadro aprovado: uma camada que cobre o quadro

  function pintaAlgo(el) {
    const tag = el.tagName.toLowerCase();
    if (tag === 'img' || tag === 'video' || tag === 'canvas' || tag === 'svg') return true;
    const cs = getComputedStyle(el);
    if (cs.backgroundImage && cs.backgroundImage !== 'none') return true;
    if (cs.backdropFilter && cs.backdropFilter !== 'none') return true;
    const m = /rgba?\(([^)]+)\)/.exec(cs.backgroundColor || '');
    if (m) {

      if (p.length < 4 || p[3] > 0.02) return true;
    }
    return false;
  }
  function conferirSangria() {
    const P = Motion.palco.getBoundingClientRect();
    const tol = 0.004 * P.width;
    for (const R of Motion.cenaR) {
      const alvos = R.__alvosCamera || [];
      if (!alvos.length) continue;
      const achados = [];
      for (const el of R.conteudo.querySelectorAll('*')) {
        const tag = el.tagName.toLowerCase();
        if (!(el instanceof HTMLElement) && tag !== 'svg') continue;
        if (el.closest('.luz, .m-sem-sangria')) continue;
        if (!alvos.some((a) => a === el || a.contains(el))) continue;
        const r = el.getBoundingClientRect();
        if (r.width < P.width - tol || r.height < P.height - tol) continue;
        const sobra = Math.min(r.left > P.left ? -1 : P.left - r.left, r.top > P.top ? -1 : P.top - r.top, r.right - P.right, r.bottom - P.bottom);
        if (sobra > 0.02 * P.width) continue;
        if (!pintaAlgo(el)) continue;
        const nome = typeof el.className === 'string' && el.className.trim() ? '.' + el.className.trim().split(/\s+/)[0] : tag;
        achados.push(nome);
      }
      if (achados.length) {
        erro(R.id, 'aviso', null, `camada de plano cheio sem sobra (${[...new Set(achados)].slice(0, 3).join(', ')}): com a câmera viva a borda dela aparece no quadro. Use a classe "plano" (sangra 6 %) ou um inset negativo.`);
      }
    }
  }

  /* ─── iniciar ─── */
  Motion.iniciar = async function iniciar() {
    const L = window.MOTION_LINHA;
    if (!L) throw new Error('MOTION_LINHA ausente: abra o filme montado pelos scripts da skill.');
    Motion.linha = L;
    const nomeFormato = L.formato || '16x9';
    const formato = FORMATOS[nomeFormato];
    const palco = document.getElementById('palco');
    palco.dataset.formato = nomeFormato;
    palco.style.width = formato.largura + 'px';
    palco.style.height = formato.altura + 'px';
    document.documentElement.dataset.formato = nomeFormato;
    Motion.palco = palco;
    const vertical = formato.altura > formato.largura;
    const ctx = {
      linha: L,
      formato,
      nomeFormato,
      vertical,
      k: vertical ? 1920 / 1080 : 1,
      palco,
      camada,
    };
    Motion.ctx = ctx;

    // 1. invólucros e render de cada cena
    Motion.cenaPorId = {};
    Motion.cenaR = L.cenas.map((info, i) => {
      const def = Motion.cenas[info.id] || {};
      if (!Motion.cenas[info.id]) erro(info.id, 'registro', null, `a cena "${info.id}" não foi registrada (cenas/${info.id}.js chamou Motion.cena?)`);
      const secao = document.createElement('section');
      secao.className = `m-cena cena-${info.id}`;
      secao.dataset.cena = info.id;
      if (info.fundoPuro) secao.classList.add('m-fundo-puro');
      const cam = document.createElement('div');
      cam.className = 'm-camera';
      const conteudo = document.createElement('div');
      conteudo.className = 'm-conteudo';
      cam.appendChild(conteudo);
      secao.appendChild(cam);
      palco.appendChild(secao);
      const R = Object.assign({}, info, {
        indice: i,
        def,
        secao,
        camera: cam,
        conteudo,
        ultima: i === L.cenas.length - 1,
        ativa: false,
        tLocal: 0,
        pontes: { inicio: {}, fim: {} },
        medidas: {},
      });
      R.el = { raiz: conteudo, cena: secao, $: (s) => conteudo.querySelector(s), $$: (s) => [...conteudo.querySelectorAll(s)] };
      Motion.cenaPorId[info.id] = R;
      return R;
    });
    Motion.cenaR.forEach((R, i) => {
      R.vizinhaAntes = Motion.cenaR[i - 1] || null;
      R.vizinhaDepois = Motion.cenaR[i + 1] || null;
      R.api = criarApi(R, ctx);
      R.lado = lado(R);
      if (typeof R.def.render === 'function') {
        try {
          R.conteudo.innerHTML = R.def.render(criarC(R, ctx)) || '';
        } catch (e) {
          erro(R.id, 'render', null, e);
        }
      }
    });

    // 2. fontes (pedidas antes de medir: a fonte só baixa quando algum texto a usa)
    const fontes = window.MOTION_FONTES || [];
    const amostra = (palco.textContent || '').replace(/\s+/g, ' ').slice(0, 400) || 'Aa';
    await Promise.all(
      fontes.map((f) =>
        document.fonts.load(`${f.estilo || 'normal'} ${f.peso || 400} 64px "${f.familia}"`, amostra).catch((e) => erro(null, 'fonte', null, e)),
      ),
    );
    await document.fonts.ready;
    for (const f of fontes) {
      if (!document.fonts.check(`${f.estilo || 'normal'} ${f.peso || 400} 64px "${f.familia}"`, 'Aa')) {
        erro(null, 'fonte', null, `a fonte "${f.familia}" (${f.peso || 400}) não carregou`);
      }
    }

    // 3. imagens decodificadas
    const imgs = [...palco.querySelectorAll('img')];
    const extras = (window.MOTION_IMAGENS || []).map((src) => {
      const im = new Image();
      im.src = src;
      return im;
    });
    await Promise.all([...imgs, ...extras].map((im) => (im.decode ? im.decode().catch(() => {}) : null)));

    // 4. montar (todas visíveis, para medir texto de verdade)
    palco.classList.add('m-medindo');
    const pose = params.get('pose');
    if (Motion.prepararMidia) {
      for (const R of Motion.cenaR) {
        try {
          Motion.prepararMidia(R);
        } catch (e) {
          erro(R.id, 'render', null, e);
        }
      }
    }
    for (const R of Motion.cenaR) {
      if (typeof R.def.montar === 'function') {
        try {
          R.def.montar(R.el, R.api);
        } catch (e) {
          erro(R.id, 'montar', null, e);
        }
      }
    }
    conferirSangria();

    if (pose) {
      // Storyboard antes da animação: só aquela cena, na pose pedida, sem chamar quadro.
      const [id, q] = pose.split(':');
      palco.classList.remove('m-medindo');
      const R = Motion.cenaPorId[id];
      if (!R) erro(id, 'pose', null, `cena "${id}" não existe neste filme`);
      else {
        R.secao.classList.add('m-ativa', `q-${q}`);
        R.ativa = true;
        zerarInvolucros(R);
        const fn = R.def.poses && R.def.poses[q];
        if (fn) {
          try {
            fn(R.el, R.api);
          } catch (e) {
            erro(id, 'pose', null, e);
          }
        }
        if (Motion.midiaNoQuadro) {
          const pend = [];
          const qd = (R.quadros || []).find((x) => x.id === q);
          Motion.midiaNoQuadro(R, qd ? qd.t : 0, pend);
          await Promise.all(pend);
        }
      }
      Motion.pronto = true;
      document.dispatchEvent(new Event('motion-pronto'));
      return;
    }

    // 5. pontes e medidas: quadro(0) e quadro(último) de cada cena
    const pedidas = {};
    for (const X of L.transicoes) {
      const def = Motion.transicoes[X.tipo];
      if (def && def.medir) {
        for (const [quem, sel, quando] of def.medir(X.opcoes || {}, X) || []) {
          const id = quem === 'A' ? X.de : X.para;
          if (!id || !sel) continue;
          (pedidas[id] = pedidas[id] || []).push([sel, quando]);
        }
      }
    }
    for (const R of Motion.cenaR) {
      const pend = [];
      for (const quando of ['inicio', 'fim']) {
        zerarInvolucros(R);
        const tl = quando === 'inicio' ? 0 : R.api.ultimo;
        quadroDaCena(R, tl, R.inicio + tl, pend);
        if (pend.length) await Promise.all(pend.splice(0));
        R.pontes[quando] = medirPontes(R, palco);
        for (const [sel, q] of pedidas[R.id] || []) {
          if (q !== quando) continue;
          const el = R.conteudo.querySelector(sel);
          if (!el) erro(R.id, 'transicao', null, `não achei "${sel}" para a transição`);
          else R.medidas[`${quando}|${sel}`] = caixaTela(el, palco);
        }
      }
    }
    // 6. transições
    for (const X of L.transicoes) {
      const def = Motion.transicoes[X.tipo];
      if (!def) {
        erro(X.de, 'transicao', null, `transição desconhecida: "${X.tipo}"`);
        continue;
      }
      X.cache = {};
      if (def.preparar) {
        try {
          def.preparar(Motion.cenaPorId[X.de].lado, X.para ? Motion.cenaPorId[X.para].lado : null, X.opcoes || {}, X.cache, X);
        } catch (e) {
          erro(X.de, 'transicao', null, e);
        }
      }
    }
    palco.classList.remove('m-medindo');
    for (const R of Motion.cenaR) R.secao.classList.remove('m-ativa');
    const t0 = parseFloat((params.get('t') || '0').replace(',', '.')) || 0;
    const p = Motion.ir(t0);
    if (p) await p;
    Motion.pronto = true;
    document.dispatchEvent(new Event('motion-pronto'));
  };

  /* ─── ir: posiciona o filme em t global ─── */
  /* Na captura, cada quadro invalida a pintura de todo texto do palco com uma sombra transparente
     que muda com t (não desenha nada). Sem isso o Chrome reaproveita o texto gravado enquanto a
     letra estava ampliada/desfocada e o quadro passa a depender da ordem de render (medido: 1 vs 4
     navegadores davam pixels diferentes nas bordas das letras). */
  function invalidarPintura(t) {
    if (CAPTURA && Motion.palco) Motion.palco.style.textShadow = `${(t * 1e-5 + 1e-7).toFixed(9)}px 0 0 transparent`;
  }

  Motion.ir = function ir(t) {
    const L = Motion.linha;
    t = clamp(+t || 0, 0, L.total);
    Motion.t = t;
    invalidarPintura(t);
    const ativas = [];
    for (const R of Motion.cenaR) {
      const on = t >= R.inicio - EPS && (t < R.fim - EPS || (R.ultima && t <= R.fim + EPS));
      if (on !== R.ativa) {
        R.secao.classList.toggle('m-ativa', on);
        R.ativa = on;
      }
      if (on) ativas.push(R);
    }
    zerarCamadas();
    for (const R of ativas) zerarInvolucros(R);
    const pend = [];
    for (const R of ativas) quadroDaCena(R, clamp(t - R.inicio, 0, R.dur), t, pend);
    for (const X of L.transicoes) aplicarTransicao(X, t);
    return pend.length ? Promise.all(pend).then(() => undefined) : undefined;
  };

  /** Uma cena sozinha, no tempo local, sem transição (storyboard e inspeção). */
  Motion.irCena = function irCena(id, tl) {
    const alvo = Motion.cenaPorId[id];
    if (!alvo) throw new Error(`cena "${id}" não existe neste filme`);
    for (const R of Motion.cenaR) {
      const on = R === alvo;
      if (on !== R.ativa) {
        R.secao.classList.toggle('m-ativa', on);
        R.ativa = on;
      }
    }
    zerarCamadas();
    invalidarPintura(alvo.inicio + tl);
    zerarInvolucros(alvo);
    const pend = [];
    quadroDaCena(alvo, clamp(tl, 0, alvo.dur), alvo.inicio + tl, pend);
    return pend.length ? Promise.all(pend).then(() => undefined) : undefined;
  };

  /* ─── erros visíveis na prévia ─── */
  function mostrarErros() {
    let caixa = document.getElementById('m-erros');
    if (!caixa) {
      caixa = document.createElement('div');
      caixa.id = 'm-erros';
      document.body.appendChild(caixa);
    }
    caixa.innerHTML = erros
      .slice(0, 8)
      .map((e) => `<div><b>${e.cena || 'motor'}</b> · ${e.fase}${e.t != null ? ` · t=${e.t}` : ''}<br>${String(e.mensagem).replace(/</g, '&lt;')}</div>`)
      .join('');
  }

  /* ─── medir a composição (o diretor automático do storyboard usa) ───
     Tamanho real das letras (cqmin, com a escala da câmera), área do herói, fotos ampliadas demais
     e as caixas de texto com a cor, para conferir contraste sobre foto. Lê o estado atual da cena. */
  function opacidadeEfetiva(el) {
    let o = 1;
    for (let n = el; n && n !== Motion.palco; n = n.parentElement) {
      const cs = getComputedStyle(n);
      if (cs.display === 'none' || cs.visibility === 'hidden') return 0;
      o *= parseFloat(cs.opacity);
    }
    return o;
  }
  function corDoTexto(el) {
    const cs = getComputedStyle(el);
    const fill = cs.webkitTextFillColor || '';
    const solida = (c) => {
      const m = /rgba?\(([^)]+)\)/.exec(c || '');
      if (!m) return null;
      const p = m[1].split(/[\s,/]+/).filter(Boolean).map(Number);
      return p.length < 4 || p[3] > 0.05 ? p.slice(0, 3) : null;
    };
    const direta = solida(fill) || solida(cs.color);
    if (direta) return direta;
    // texto com degradê (background-clip: text): a média das cores do degradê
    for (let n = el; n && n !== Motion.palco; n = n.parentElement) {
      const img = getComputedStyle(n).backgroundImage || '';
      const cores = [...img.matchAll(/rgba?\(([^)]+)\)/g)].map((m) => m[1].split(/[\s,/]+/).filter(Boolean).map(Number).slice(0, 3));
      if (cores.length) return [0, 1, 2].map((k) => cores.reduce((s, c) => s + c[k], 0) / cores.length);
    }
    return [255, 255, 255];
  }
  function medirComposicao(id) {
    const R = Motion.cenaPorId[id];
    if (!R) return null;
    const P = Motion.palco.getBoundingClientRect();
    const W = P.width, H = P.height, um = Math.min(W, H) / 100;
    const recorte = (r) => {
      const l = Math.max(r.left, P.left), t = Math.max(r.top, P.top), d = Math.min(r.right, P.right), b = Math.min(r.bottom, P.bottom);
      return d > l && b > t ? { x: l - P.left, y: t - P.top, l: d - l, a: b - t } : null;
    };
    // blocos de texto
    const blocos = new Map();
    const w = document.createTreeWalker(R.conteudo, NodeFilter.SHOW_TEXT);
    for (let n = w.nextNode(); n; n = w.nextNode()) {
      if (!n.textContent.trim() || !n.parentElement || n.parentElement.closest('svg')) continue;
      const pai = n.parentElement;
      const bloco = pai.closest('h1,h2,h3,h4,h5,p,li,.titulo,.apoio,.frase,[data-texto]') || pai;
      if (!R.conteudo.contains(bloco)) continue;
      const o = opacidadeEfetiva(pai);
      const atual = blocos.get(bloco) || { o: 0, cores: [], n: 0 };
      atual.o = Math.max(atual.o, o);
      if (o > 0.3) atual.cores.push(corDoTexto(pai));
      blocos.set(bloco, atual);
    }
    const textos = [];
    for (const [el, info] of blocos) {
      const r = el.getBoundingClientRect();
      const c = recorte(r);
      if (!c || info.o < 0.3) continue;
      const fs = parseFloat(getComputedStyle(el).fontSize) || 16;
      const escala = el.offsetWidth > 0 ? r.width / el.offsetWidth : 1;
      el.setAttribute('data-m-medido', '');
      const cor = info.cores.length ? [0, 1, 2].map((k) => info.cores.reduce((s, x) => s + x[k], 0) / info.cores.length) : [255, 255, 255];
      textos.push({ texto: el.textContent.replace(/\s+/g, ' ').trim().slice(0, 60), cqmin: Math.round(((fs * escala) / um) * 10) / 10, caixa: c, cor, o: Math.round(info.o * 100) / 100 });
    }
    // visuais (o herói): imagem, SVG, vídeo, mockup, [data-heroi] e caixas com fundo; planos cheios não contam
    const visuais = [];
    for (const el of R.conteudo.querySelectorAll('img, svg, video, .m-mockup, [data-heroi], div, span')) {
      if (el.closest('.luz, [data-m-medido]') || (el.tagName.toLowerCase() !== 'svg' && el.closest('svg'))) continue;
      const tag = el.tagName.toLowerCase();
      if ((tag === 'div' || tag === 'span') && !el.hasAttribute('data-heroi') && !el.classList.contains('m-mockup') && !pintaAlgo(el)) continue;
      const c = recorte(el.getBoundingClientRect());
      if (!c) continue;
      const area = (c.l * c.a) / (W * H);
      if (area < 0.01 || area > 0.92 || opacidadeEfetiva(el) < 0.3) continue;
      visuais.push({ area, heroi: el.hasAttribute('data-heroi'), caixa: c });
    }
    const maior = visuais.reduce((m, v) => Math.max(m, v.area), 0);
    const declarado = visuais.filter((v) => v.heroi).reduce((m, v) => Math.max(m, v.area), 0);
    // fotos: ampliação real (px na tela ÷ px do arquivo), com o enquadramento cover
    const fotos = [];
    for (const img of R.conteudo.querySelectorAll('img.m-foto')) {
      if (!img.naturalWidth || opacidadeEfetiva(img) < 0.3) continue;
      const r = img.getBoundingClientRect();
      if (!recorte(r)) continue;
      const fit = getComputedStyle(img).objectFit;
      const ex = r.width / img.naturalWidth, ey = r.height / img.naturalHeight;
      const escala = fit === 'contain' ? Math.min(ex, ey) : Math.max(ex, ey);
      fotos.push({ arquivo: decodeURIComponent((img.getAttribute('src') || '').split('/').pop() || ''), escala: Math.round(escala * 100) / 100, natural: [img.naturalWidth, img.naturalHeight] });
    }
    return { largura: W, altura: H, textos, heroi: Math.round(Math.max(maior, declarado) * 1000) / 1000, fotos };
  }
  Motion.medirComposicao = medirComposicao;

  /* ─── o que os scripts da skill usam ─── */
  window.__MOTION__ = {
    versao: Motion.versao,
    get pronto() {
      return Motion.pronto;
    },
    erros: () => erros.slice(),
    linha: () => Motion.linha,
    ir: async (t) => {
      const p = Motion.ir(t);
      if (p) await p;
      return true;
    },
    irCena: async (id, tl) => {
      const p = Motion.irCena(id, tl);
      if (p) await p;
      return true;
    },
    cenas: () =>
      Motion.cenaR.map((R) => ({
        id: R.id,
        inicio: R.inicio,
        dur: R.dur,
        temQuadro: typeof R.def.quadro === 'function',
        poses: Object.keys(R.def.poses || {}),
      })),
    pontes: () => Object.fromEntries(Motion.cenaR.map((R) => [R.id, R.pontes])),
    medirComposicao: (id) => medirComposicao(id),
    /** Esconde (ou mostra de novo) os textos medidos da cena: o fundo por baixo deles, para o contraste. */
    esconderTextos: (id, sim) => {
      const R = Motion.cenaPorId[id];
      if (R) R.secao.classList.toggle('m-sem-texto', !!sim);
      return true;
    },
  };

  Motion.interno = { posarCamera, estilizarCena, caixaTela, caixaLayout, criarSet, zerarInvolucros };
})();

<script>/* camera.js — a câmera da cena (api.camera).

   const cam = api.camera({
     alvo: el.$('.mundo'),             // o que a câmera move (padrão: el.raiz)
     camadas: [                        // paralaxe por profundidade (opcional)
       { el: el.$('.luz'), z: -0.5 },  // longe: anda metade
       { el: el.$('.grade'), z: 0 },   // plano focal
       { el: el.$('.titulo'), z: 0.5 },// perto: anda 1,5×
     ],
     modo: '2.5d',                     // '2.5d' (escala/deslocamento por camada) | '3d'
     perspectiva: 1.2,                 // distância câmera → plano focal, em larguras do quadro
     abertura: 0,                      // cqw de desfoque por unidade de |z − foco| (profundidade de campo)
     origem: [50, 50],                 // ponto de fuga, % do quadro
   });
   cam.pose({ zoom, avanco, x, y, giro, rx, ry, foco, desfoque });
   cam.mergulho(t, t0, t1, alvoEl, { cobrir, curva, para }) → { zoom, x, y } (passe para pose)

   x/y são o ponto para onde a câmera OLHA, em cqw a partir do centro do quadro: com x = 12, y = -4
   o ponto (12, -4) do plano focal vai para o centro da tela (o conteúdo anda para a esquerda e para
   baixo), com ou sem camadas e em qualquer zoom. zoom é lente (tudo junto, em volta do centro da
   tela); avanco é dolly (camadas perto crescem mais). Para um close num elemento:
     const P = cam.centro(el.$('.palavra'));          // no montar
     cam.pose({ zoom: 1.6, x: P[0], y: P[1] });       // o elemento no centro, 1,6×
   Em repouso (zoom 1, avanco 0, x = y = 0) nada muda: o quadro aprovado continua sendo o CSS. */
(function () {
  'use strict';
  Motion.estender((api, ctx) => {
    const { clamp, ease, prog, logLerp, lerp } = api;
    const R = ctx.R;
    const W = ctx.formato.largura;
    const H = api.H;
    const u = W / 100;

    function origemPx(el, V) {
      const b = api.caixa(el);
      return `${((V[0] - b.x) * u).toFixed(3)}px ${((V[1] - b.y) * u).toFixed(3)}px`;
    }

    api.camera = function camera(op = {}) {
      const alvo = op.alvo || R.el.raiz;
      const modo = op.modo || '2.5d';
      const perspectiva = op.perspectiva ?? 1.2;
      const abertura = op.abertura ?? 0;
      const origem = op.origem || [50, 50];
      // ponto de fuga em cqw a partir do centro do quadro
      const V = [origem[0] - 50, (origem[1] / 100) * H - H / 2];
      alvo.style.transformOrigin = origemPx(alvo, V);
      const camadas = (op.camadas || []).filter((c) => c && c.el).map((c) => {
        c.el.style.transformOrigin = origemPx(c.el, V);
        return { el: c.el, z: c.z || 0 };
      });
      // o motor confere se alguma camada de plano cheio sob esta câmera ficou sem sobra
      R.__alvosCamera = R.__alvosCamera || [];
      R.__alvosCamera.push(alvo, ...camadas.map((c) => c.el));
      if (modo === '3d') {
        alvo.style.transformStyle = 'preserve-3d';
        for (const c of camadas) c.el.style.transformStyle = 'preserve-3d';
      }
      const Pcqw = perspectiva * 100; // perspectiva em cqw

      function pose({ zoom = 1, avanco = 0, x = 0, y = 0, giro = 0, rx = 0, ry = 0, foco = 0, desfoque = 0 } = {}) {
        if (modo === '3d') {
          api.set(alvo, { pre: '', persp: Pcqw, z: avanco * Pcqw, x: -x * zoom, y: -y * zoom, rx, ry, r: giro, s: zoom, subpixel: true });
          for (const c of camadas) {
            const blur = abertura * Math.abs(c.z - foco);
            api.set(c.el, { pre: '', z: c.z * Pcqw * 0.5, blur });
          }
          if (desfoque || alvo.__mDesf) {
            alvo.__mDesf = true;
            api.set(alvo, { blur: desfoque });
          }
          return;
        }
        if (!camadas.length) {
          // p' = V + zoom·m·(p − V − olhar): o ponto olhado vai para o centro em qualquer zoom
          const m = 1 / Math.max(0.05, 1 - avanco);
          const k = zoom * m;
          api.set(alvo, { pre: '', x: -x * k, y: -y * k, s: k, r: giro, blur: desfoque, subpixel: true });
          return;
        }
        api.set(alvo, { pre: '', s: zoom, r: giro, blur: desfoque, subpixel: true });
        for (const c of camadas) {
          const d = 1 - c.z - avanco;
          const dd = Math.max(0.05, d);
          const m = (1 - c.z) / dd;
          // camada passando pela câmera: apaga e desfoca sozinha
          const passando = clamp((0.12 - d) / 0.07);
          const blur = abertura * Math.abs(c.z - foco) + passando * 1.2;
          api.set(c.el, { pre: '', x: -x / dd, y: -y / dd, s: m, blur, o: 1 - passando });
        }
      }

      function mergulho(t, t0, t1, alvoEl, { cobrir = 1, curva = ease.mergulho, para = null } = {}) {
        if (!alvoEl) return { zoom: 1, x: 0, y: 0 };
        if (!alvoEl.__mCaixa) alvoEl.__mCaixa = api.caixa(alvoEl);
        const b = alvoEl.__mCaixa;
        const S1 = para && para.l ? para.l / b.l : cobrir * Math.max(100 / b.l, H / b.a);
        const e = curva(prog(t, t0, t1));
        const S = logLerp(1, S1, e);
        const dest = para ? [para.cx, para.cy] : [0, 0];
        const k = Math.abs(S1 - 1) < 1e-6 ? e : (S - 1) / (S1 - 1);
        const G = [lerp(b.cx, dest[0], k), lerp(b.cy, dest[1], k)];
        // p' = V + S(p − V − olhar) = G  →  olhar = p − V − (G − V)/S
        return { zoom: S, x: b.cx - V[0] - (G[0] - V[0]) / S, y: b.cy - V[1] - (G[1] - V[1]) / S };
      }

      /** Centro de um elemento (cqw a partir do centro do quadro), medido no layout: para `pose({ x, y })`. */
      function centro(el) {
        if (!el) return [0, 0];
        const b = api.caixa(el);
        return [b.cx, b.cy];
      }

      return { pose, mergulho, centro, caixa: (el) => api.caixaNaTela(el), alvo, camadas };
    };
  });
})();
